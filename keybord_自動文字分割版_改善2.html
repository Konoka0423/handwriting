
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>メッセージと文字を交換するサイト</title>

<style>
:root {
    color-scheme: light;
    --bg: #f4f1ea;
    --panel: #ffffff;
    --ink: #1d1d1f;
    --muted: #6b7280;
    --line: #d6d3cc;
    --accent: #2563eb;
    --accent-soft: #dbeafe;
    --danger: #b91c1c;
}

body {
    margin: 0;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color: var(--ink);
}

main {
    max-width: 1180px;
    margin: 0 auto;
    padding: 24px 16px 40px;
}

header {
    margin-bottom: 18px;
}

header h1 {
    margin: 0;
    font-size: clamp(1.8rem, 3vw, 2.6rem);
    letter-spacing: 0.04em;
}

.status {
    width: min(100%, 960px);
    margin: 8px auto 16px;
    color: var(--muted);
    text-align: center;
    font-size: 0.95rem;
}

.gallery {
    margin-top: 10px;
    padding: 18px;
}

button {
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 11px 18px;
    font-size: 1rem;
    line-height: 1;
    color: var(--ink);
    background: var(--panel);
    cursor: pointer;
    transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
}

button:hover {
    transform: translateY(-1px);
    box-shadow: 0 8px 18px rgba(15, 23, 42, 0.08);
}

button.destructive {
    color: var(--danger);
}

.snapshot-list {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 14px;
}

.snapshot-item {
    border: 1px solid var(--line);
    border-radius: 16px;
    background: rgba(255, 255, 255, 0.92);
    padding: 12px;
}

.snapshot-meta {
    display: flex;
    justify-content: space-between;
    gap: 8px;
    align-items: center;
    margin-bottom: 10px;
    font-size: 0.92rem;
}

.snapshot-title {
    font-weight: 700;
}

.snapshot-preview {
    display: grid;
    place-items: center;
    min-height: 160px;
    border: 1px solid #e5e7eb;
    border-radius: 14px;
    background:
        linear-gradient(45deg, #f3f4f6 25%, transparent 25%) 0 0 / 14px 14px,
        linear-gradient(-45deg, #f3f4f6 25%, transparent 25%) 0 7px / 14px 14px,
        linear-gradient(45deg, transparent 75%, #f3f4f6 75%) 7px 0 / 14px 14px,
        linear-gradient(-45deg, transparent 75%, #f3f4f6 75%) 7px 7px / 14px 14px,
        #fff;
    overflow: hidden;
}

.snapshot-preview img {
    display: block;
    max-width: 100%;
    max-height: 240px;
    object-fit: contain;
}

.empty {
    color: var(--muted);
    text-align: center;
    padding: 28px 0;
}

.preview-panel {
    display: none;
    margin-top: 18px;
    padding: 18px;
    border-radius: 16px;
    background: rgba(255, 255, 255, 0.7);
}

.preview-panel h2 {
    margin: 0 0 12px;
}

/* 外側の余白を含めた全体 */
.preview-shell {
    position: relative;
    width: min(100%, 960px);
    margin: 0 auto;
    aspect-ratio: 11 / 7;
    border: 1px solid var(--line);
    border-radius: 18px;
    overflow: hidden;
    background: #fff;
}

/* 中央のカード領域 */
.card-area {
    position: absolute;
    left: 9.09%;
    top: 11.43%;
    width: 81.82%;
    height: 77.14%;
    background: #fff;
}

/* カード本体と範囲選択用キャンバス */
.card-area canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    touch-action: none;
}

/* メッセージ用キャンバス */
#messageCanvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    touch-action: none;
    pointer-events: none;
    z-index: 3;
}

.preview-controls {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px;
    margin-top: 14px;
}

.keyboard-tools {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px;
    margin: 0 0 14px;
}

#keyboardPanel {
    display: none;
    position: relative;
    z-index: 6;
    margin: 14px 0 24px;
    padding: 16px;
    border: 1px solid var(--line);
    border-radius: 14px;
    background: #fff;
    overflow-x: auto;
}

#keyboardPanel.visible {
    display: block;
}

.keyboard-grid {
    display: grid;
    grid-template-columns: repeat(17, minmax(0, 1fr));
    gap: 4px;
    min-width: 720px;
}

.keyboard-key {
    min-width: 0;
    min-height: 42px;
    padding: 3px 1px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    border: 1px solid #ccc;
    border-radius: 3px;
    background: #e5e5e5;
    color: #222;
}

.keyboard-key .key-label {
    font-size: 16px;
}

.keyboard-key img {
    width: 28px;
    height: 28px;
    object-fit: contain;
}

.keyboard-key.registered {
    background: #fff;
    border-color: #6b7280;
}

.keyboard-key:disabled {
    opacity: 0.5;
    background: #f3f4f6;
    cursor: not-allowed;
}

#registerDialog {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 1000;
    background: #0008;
    align-items: center;
    justify-content: center;
    padding: 16px;
}

#registerDialog.visible {
    display: flex;
}

.register-box {
    width: min(420px, 100%);
    background: #fff;
    border-radius: 14px;
    padding: 22px;
    box-shadow: 0 10px 40px #0003;
}

.register-box select {
    width: 100%;
    padding: 12px;
    margin: 12px 0;
    font-size: 18px;
}

.register-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: flex-end;
}

.site-nav {
    width: min(1100px, calc(100% - 28px));
    margin: 16px auto 24px;
    padding: 8px;
    display: flex;
    gap: 8px;
    border: 1px solid #dedede;
    border-radius: 16px;
    background: #f7f7f7;
    box-sizing: border-box;
}

.site-nav a {
    flex: 1;
    min-width: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 13px 10px;
    border-radius: 11px;
    text-decoration: none;
    color: #333;
    font-size: 15px;
    font-weight: 600;
    text-align: center;
    transition: background 0.15s ease, color 0.15s ease;
}

.site-nav a:hover {
    background: #e9e9e9;
}

.site-nav a.active {
    background: #252525;
    color: #fff;
}

.site-nav .nav-icon {
    font-size: 18px;
    line-height: 1;
}

@media (max-width: 600px) {
    .keyboard-grid {
        grid-template-columns: repeat(18, minmax(0, 1fr));
    }
}

@media (max-width: 520px) {
    .site-nav {
        width: calc(100% - 20px);
        margin: 10px auto 18px;
        padding: 5px;
        gap: 5px;
    }

    .site-nav a {
        padding: 11px 5px;
        gap: 5px;
        font-size: 13px;
    }

    .site-nav .nav-icon {
        display: none;
    }
}
</style>
</head>

<body>
<main>
    <header>
        <h1>メッセージと文字を交換するサイト</h1>
    </header>

    <!-- ナビゲーションバー -->
    <nav class="site-nav" aria-label="メインナビゲーション">
        <a href="write.html">
            <span class="nav-icon">✎</span>
            <span>メッセージを書く</span>
        </a>
        <a href="keybord.html" class="active">
            <span class="nav-icon">▤</span>
            <span>みんなのメッセージ</span>
        </a>
    </nav>

    <div id="status" class="status">
        保存カードを選ぶと、自動分割または範囲選択で文字をキーボードへ登録できます。
    </div>

    <section id="previewPanel" class="preview-panel">
        <h2>選択したカード</h2>

        <div class="preview-shell">
            <div class="card-area">
                <canvas id="previewCanvas" width="900" height="540"></canvas>
                <canvas id="previewSelectionCanvas" width="900" height="540"></canvas>
            </div>

            <canvas id="messageCanvas" width="1100" height="700"></canvas>
        </div>

        <div class="preview-controls">
            <label for="segmentationDirection">文字の並び：</label>
            <select id="segmentationDirection" style="padding:10px;border:1px solid #d6d3cc;border-radius:10px;">
                <option value="horizontal">横書き</option>
                <option value="vertical">縦書き</option>
            </select>
            <button type="button" id="autoSegment">文字を自動分割</button>
            <button id="previewSelect">範囲選択</button>
            <button type="button" id="registerKeyboard">キーボードに登録</button>
            <button type="button" id="toggleKeyboard">キーボードを表示</button>
            <button id="previewClear" class="destructive">プレビューを閉じる</button>
            <button type="button" id="toggleMessage">メッセージを書く</button>
            <button type="button" id="toggleMessageVisibility">メッセージを非表示</button>
        </div>
    </section>

    <section id="keyboardPanel" aria-label="手書き文字キーボード">
        <h2>手書き文字キーボード</h2>
        <p>登録済みの文字が表示されます。まだ登録されていない文字は薄く表示されます。</p>
        <div id="keyboardGrid" class="keyboard-grid"></div>
    </section>

    <div id="registerDialog" role="dialog" aria-modal="true" aria-labelledby="registerTitle">
        <div class="register-box">
            <h2 id="registerTitle">登録する文字を選択</h2>
            <p>選択した文字を、どのひらがなとして登録するか選んでください。</p>
            <select id="registerKana" aria-label="登録するひらがな"></select>
            <div class="register-actions">
                <button type="button" id="cancelRegister">キャンセル</button>
                <button type="button" id="confirmRegister">登録する</button>
            </div>
        </div>
    </div>

    <section class="gallery">
        <h2>保存したカード</h2>
        <div id="snapshotList" class="snapshot-list">
            <div id="snapshotEmpty" class="empty">まだ保存されていません。</div>
        </div>
    </section>
</main>

<script>
var SAVED_CARD_STORAGE_KEY = "sharedSavedCards_v1";
var GLYPH_STORAGE_KEY = "handwritingKeyboardGlyphs_v1";

var status = document.getElementById("status");
var snapshotList = document.getElementById("snapshotList");
var snapshotEmpty = document.getElementById("snapshotEmpty");
var previewPanel = document.getElementById("previewPanel");

var previewCanvas = document.getElementById("previewCanvas");
var previewSelectionCanvas = document.getElementById("previewSelectionCanvas");
var previewCtx = previewCanvas.getContext("2d");
var previewSelectionCtx = previewSelectionCanvas.getContext("2d");

var messageCanvas = document.getElementById("messageCanvas");
var messageCtx = messageCanvas.getContext("2d");

var toggleMessageButton = document.getElementById("toggleMessage");
var toggleMessageVisibilityButton =
    document.getElementById("toggleMessageVisibility");

var messageVisible = true;
var messageDrawing = false;
var messageHasContent = false;
var messageMode = false;

var previewSelectButton = document.getElementById("previewSelect");
var previewClearButton = document.getElementById("previewClear");
var registerKeyboardButton = document.getElementById("registerKeyboard");
var toggleKeyboardButton = document.getElementById("toggleKeyboard");
var autoSegmentButton = document.getElementById("autoSegment");
var segmentationDirection = document.getElementById("segmentationDirection");

var keyboardPanel = document.getElementById("keyboardPanel");
var keyboardGrid = document.getElementById("keyboardGrid");

var registerDialog = document.getElementById("registerDialog");
var registerKana = document.getElementById("registerKana");
var confirmRegisterButton = document.getElementById("confirmRegister");
var cancelRegisterButton = document.getElementById("cancelRegister");

var snapshots = [];
var previewImage = null;
var previewLayers = [];
var previewSelectedLayerIndex = -1;
var previewSelecting = false;
var previewSelection = null;
var previewSelectionStart = null;
var previewMode = "idle";
var segmentationBoxes = [];
var selectedSegmentationBox = -1;

var kanaKeys = [
    "あ", "い", "う", "え", "お",
    "か", "き", "く", "け", "こ",
    "さ", "し", "す", "せ", "そ",
    "た", "ち", "つ", "て", "と",
    "な", "に", "ぬ", "ね", "の",
    "は", "ひ", "ふ", "へ", "ほ",
    "ま", "み", "む", "め", "も",
    "や", "ゆ", "よ",
    "ら", "り", "る", "れ", "ろ",
    "わ", "を", "ん",
    "が", "ぎ", "ぐ", "げ", "ご",
    "ざ", "じ", "ず", "ぜ", "ぞ",
    "だ", "ぢ", "づ", "で", "ど",
    "ば", "び", "ぶ", "べ", "ぼ",
    "ぱ", "ぴ", "ぷ", "ぺ", "ぽ"
];

var registeredGlyphs = {};
var registerTargetLayer = null;


// ------------------------------
// 共通処理
// ------------------------------

function setStatus(message) {
    status.textContent = message;
}

function getCanvasPoint(event, targetCanvas) {
    var rect = targetCanvas.getBoundingClientRect();

    var scaleX = targetCanvas.width / rect.width;
    var scaleY = targetCanvas.height / rect.height;

    return {
        x: (event.clientX - rect.left) * scaleX,
        y: (event.clientY - rect.top) * scaleY
    };
}

function normalizeRect(start, end) {
    return {
        x: Math.min(start.x, end.x),
        y: Math.min(start.y, end.y),
        width: Math.abs(end.x - start.x),
        height: Math.abs(end.y - start.y)
    };
}


// ------------------------------
// 保存カードの読み込み・表示
// ------------------------------

function loadSnapshotsFromStorage() {
    try {
        var raw = localStorage.getItem(SAVED_CARD_STORAGE_KEY);
        var parsed = raw ? JSON.parse(raw) : [];

        if (!Array.isArray(parsed)) {
            snapshots = [];
            return;
        }

        snapshots = parsed.filter(function (item) {
            return item && typeof item.dataUrl === "string";
        }).map(function (item) {
            return {
                dataUrl: item.dataUrl,
                width: typeof item.width === "number" ? item.width : 900,
                height: typeof item.height === "number" ? item.height : 540
            };
        });

    } catch (error) {
        snapshots = [];
    }
}

function updateSnapshotEmptyState() {
    snapshotEmpty.style.display =
        snapshots.length === 0 ? "grid" : "none";
}

function renderSnapshotList() {
    snapshotList.innerHTML = "";

    if (snapshots.length === 0) {
        snapshotList.appendChild(snapshotEmpty);
        updateSnapshotEmptyState();
        return;
    }

    snapshots.forEach(function (snapshot, index) {
        var item = document.createElement("article");
        item.className = "snapshot-item";
        item.title = "クリックして選択カードを表示";
        item.style.cursor = "pointer";

        var meta = document.createElement("div");
        meta.className = "snapshot-meta";

        var title = document.createElement("div");
        title.className = "snapshot-title";
        title.textContent = "カード " + (index + 1);

        meta.appendChild(title);

        var preview = document.createElement("div");
        preview.className = "snapshot-preview";

        var img = document.createElement("img");
        img.src = snapshot.dataUrl;
        img.alt = "保存したカード " + (index + 1);

        preview.appendChild(img);
        item.appendChild(meta);
        item.appendChild(preview);

        item.addEventListener("click", function () {
            showSnapshotPreview(snapshot);
        });

        snapshotList.appendChild(item);
    });
}


// ------------------------------
// プレビュー・範囲選択
// ------------------------------

function clearPreviewOverlay() {
    previewSelectionCtx.clearRect(
        0,
        0,
        previewSelectionCanvas.width,
        previewSelectionCanvas.height
    );
}

function drawPreviewLayer(layer) {
    previewSelectionCtx.drawImage(
        layer.canvas,
        layer.x,
        layer.y
    );
}

function redrawPreviewOverlay() {
    clearPreviewOverlay();

    for (var index = 0; index < previewLayers.length; index += 1) {
        drawPreviewLayer(previewLayers[index]);
    }

    // 自動分割した文字の範囲を表示
    if (segmentationBoxes.length > 0) {
        segmentationBoxes.forEach(function (box, index) {
            previewSelectionCtx.save();
            previewSelectionCtx.lineWidth = index === selectedSegmentationBox ? 4 : 2;
            previewSelectionCtx.strokeStyle =
                index === selectedSegmentationBox ? "#2563eb" : "#16a34a";
            previewSelectionCtx.fillStyle =
                index === selectedSegmentationBox
                    ? "rgba(37, 99, 235, 0.10)"
                    : "rgba(22, 163, 74, 0.06)";
            previewSelectionCtx.setLineDash([]);
            previewSelectionCtx.fillRect(box.x, box.y, box.width, box.height);
            previewSelectionCtx.strokeRect(box.x, box.y, box.width, box.height);
            previewSelectionCtx.restore();
        });
    }

    if (previewMode === "select" && previewSelection) {
        previewSelectionCtx.save();

        previewSelectionCtx.strokeStyle = "rgba(37, 99, 235, 0.95)";
        previewSelectionCtx.fillStyle = "rgba(37, 99, 235, 0.10)";
        previewSelectionCtx.lineWidth = 2;
        previewSelectionCtx.setLineDash([8, 6]);

        previewSelectionCtx.fillRect(
            previewSelection.x,
            previewSelection.y,
            previewSelection.width,
            previewSelection.height
        );

        previewSelectionCtx.strokeRect(
            previewSelection.x,
            previewSelection.y,
            previewSelection.width,
            previewSelection.height
        );

        previewSelectionCtx.restore();
    }
}

function showSnapshotPreview(snapshot) {
    previewPanel.style.display = "block";

    var image = new Image();

    image.onload = function () {
        previewImage = image;

        // 外側のキャンバス全体を白くする
        previewCtx.clearRect(0, 0, previewCanvas.width, previewCanvas.height);
        previewCtx.fillStyle = "#ffffff";
        previewCtx.fillRect(0, 0, previewCanvas.width, previewCanvas.height);

        // 内側のカードの表示範囲
        var marginX = 90;
        var marginY = 65;

        var innerWidth = previewCanvas.width - marginX * 2;
        var innerHeight = previewCanvas.height - marginY * 2;

        // カードの縦横比を維持して表示
        var scale = Math.min(
            innerWidth / image.naturalWidth,
            innerHeight / image.naturalHeight
        );

        var drawWidth = image.naturalWidth * scale;
        var drawHeight = image.naturalHeight * scale;

        var drawX = (previewCanvas.width - drawWidth) / 2;
        var drawY = (previewCanvas.height - drawHeight) / 2;

        // 内側のカードを描画
        previewCtx.drawImage(
            image,
            drawX,
            drawY,
            drawWidth,
            drawHeight
        );

        // カードの境界線
        previewCtx.strokeStyle = "#d6d3cc";
        previewCtx.lineWidth = 2;
        previewCtx.strokeRect(
            drawX,
            drawY,
            drawWidth,
            drawHeight
        );

        // 範囲選択関連の初期化
        previewLayers = [];
        previewSelectedLayerIndex = -1;
        segmentationBoxes = [];
        selectedSegmentationBox = -1;
        previewSelecting = false;
        previewSelection = null;
        previewSelectionStart = null;
        previewMode = "select";

        previewSelectionCanvas.style.pointerEvents = "auto";

        redrawPreviewOverlay();

        setStatus("保存カードを表示しました。範囲選択してキーボードに登録できます。");
    };

    image.src = snapshot.dataUrl;
}

function resetPreview() {
    previewCtx.clearRect(0, 0, previewCanvas.width, previewCanvas.height);
    previewCtx.fillStyle = "#ffffff";
    previewCtx.fillRect(0, 0, previewCanvas.width, previewCanvas.height);

    previewSelectionCtx.clearRect(
        0, 0,
        previewSelectionCanvas.width,
        previewSelectionCanvas.height
    );

    previewImage = null;
    previewLayers = [];
    previewSelectedLayerIndex = -1;
    segmentationBoxes = [];
    selectedSegmentationBox = -1;
    previewSelecting = false;
    previewSelection = null;
    previewSelectionStart = null;
    previewMode = "idle";

    previewSelectionCanvas.style.pointerEvents = "none";
    previewPanel.style.display = "none";

    // messageCanvasは初期化しない！
}

function createPreviewCrop(rect) {
    if (!previewImage) {
        return null;
    }

    var left = Math.max(0, Math.floor(rect.x));
    var top = Math.max(0, Math.floor(rect.y));

    var width = Math.min(
        previewCanvas.width - left,
        Math.ceil(rect.width)
    );

    var height = Math.min(
        previewCanvas.height - top,
        Math.ceil(rect.height)
    );

    if (width <= 0 || height <= 0) {
        return null;
    }

    var cropCanvas = document.createElement("canvas");
    cropCanvas.width = width;
    cropCanvas.height = height;

    var cropCtx = cropCanvas.getContext("2d");

    var sourceImageData = previewCtx.getImageData(
        left,
        top,
        width,
        height
    );

    var pixels = sourceImageData.data;

    for (var index = 0; index < pixels.length; index += 4) {
        var r = pixels[index];
        var g = pixels[index + 1];
        var b = pixels[index + 2];

        if (r > 250 && g > 250 && b > 250) {
            pixels[index + 3] = 0;
        }
    }

    cropCtx.putImageData(sourceImageData, 0, 0);

    return {
        canvas: cropCanvas,
        width: width,
        height: height,
        x: left,
        y: top
    };
}

function cutPreviewSelection() {
    if (
        !previewSelection ||
        previewSelection.width < 2 ||
        previewSelection.height < 2
    ) {
        setStatus("範囲が小さすぎます。もう一度選んでください。");
        return;
    }

    var crop = createPreviewCrop(previewSelection);

    if (!crop) {
        setStatus("選択した範囲から切り出せませんでした。");
        return;
    }

    previewLayers.push(crop);
    previewSelectedLayerIndex = previewLayers.length - 1;
    segmentationBoxes = [];
    selectedSegmentationBox = -1;

    previewSelecting = false;

    previewSelection = {
        x: previewSelection.x,
        y: previewSelection.y,
        width: previewSelection.width,
        height: previewSelection.height
    };

    previewSelectionStart = null;
    previewMode = "select";

    redrawPreviewOverlay();

    setStatus("範囲を切り出しました。キーボードに登録できます。");
}

function beginPreviewSelection(event) {
    previewSelecting = true;

    previewSelectionCanvas.setPointerCapture(event.pointerId);

    var point = getCanvasPoint(
        event,
        previewSelectionCanvas
    );

    previewSelectionStart = point;

    previewSelection = {
        x: point.x,
        y: point.y,
        width: 0,
        height: 0
    };

    redrawPreviewOverlay();
}

function continuePreviewSelection(event) {
    if (!previewSelecting) {
        return;
    }

    previewSelection = normalizeRect(
        previewSelectionStart,
        getCanvasPoint(event, previewSelectionCanvas)
    );

    redrawPreviewOverlay();
}

function stopPreviewSelection(event) {
    if (!previewSelecting) {
        return;
    }

    previewSelecting = false;

    if (previewSelectionCanvas.hasPointerCapture(event.pointerId)) {
        previewSelectionCanvas.releasePointerCapture(event.pointerId);
    }

    if (
        previewSelection &&
        (
            previewSelection.width < 2 ||
            previewSelection.height < 2
        )
    ) {
        previewSelection = null;
        redrawPreviewOverlay();

        setStatus(
            "範囲が小さすぎます。もう一度、少し広めに選んでください。"
        );

        return;
    }

    if (previewSelection) {
        cutPreviewSelection();
    }
}



// ------------------------------
// 自動文字分割
// ------------------------------

// 画像の黒い線がある位置を調べ、行・列と文字の範囲を推定する
function getInkMask(imageData) {
    var data = imageData.data;
    var mask = new Uint8Array(imageData.width * imageData.height);

    for (var y = 0; y < imageData.height; y += 1) {
        for (var x = 0; x < imageData.width; x += 1) {
            var index = (y * imageData.width + x) * 4;
            var r = data[index];
            var g = data[index + 1];
            var b = data[index + 2];

            // カードの薄い灰色の枠線を文字として拾わないよう、黒に近い画素だけを対象にする
            var brightness = (r + g + b) / 3;
            if (brightness < 165) {
                mask[y * imageData.width + x] = 1;
            }
        }
    }
    return mask;
}

function makeProjection(mask, width, height, direction) {
    var length = direction === "horizontal" ? width : height;
    var projection = new Array(length).fill(0);

    for (var y = 0; y < height; y += 1) {
        for (var x = 0; x < width; x += 1) {
            if (mask[y * width + x]) {
                projection[direction === "horizontal" ? x : y] += 1;
            }
        }
    }
    return projection;
}

// 投影値が一定以上ある連続範囲を取得する
function findProjectionGroups(projection, threshold, mergeGap) {
    var groups = [];
    var start = -1;
    var lastInk = -1;

    for (var i = 0; i < projection.length; i += 1) {
        if (projection[i] >= threshold) {
            if (start === -1) start = i;
            lastInk = i;
        } else if (start !== -1 && i - lastInk > mergeGap) {
            groups.push({ start: start, end: lastInk + 1 });
            start = -1;
            lastInk = -1;
        }
    }

    if (start !== -1) {
        groups.push({ start: start, end: lastInk + 1 });
    }
    return groups;
}

function trimBoxToInk(mask, width, height, box, padding) {
    var minX = width, minY = height, maxX = -1, maxY = -1;

    for (var y = Math.max(0, box.y); y < Math.min(height, box.y + box.height); y += 1) {
        for (var x = Math.max(0, box.x); x < Math.min(width, box.x + box.width); x += 1) {
            if (mask[y * width + x]) {
                minX = Math.min(minX, x);
                minY = Math.min(minY, y);
                maxX = Math.max(maxX, x);
                maxY = Math.max(maxY, y);
            }
        }
    }

    if (maxX < minX || maxY < minY) return null;

    var left = Math.max(0, minX - padding);
    var top = Math.max(0, minY - padding);
    var right = Math.min(width, maxX + 1 + padding);
    var bottom = Math.min(height, maxY + 1 + padding);

    return {
        x: left, y: top,
        width: right - left,
        height: bottom - top
    };
}

// 1行（または1列）の中を、投影値の谷を使って文字ごとに分ける
function splitLineIntoCharacters(mask, width, height, lineBox, direction) {
    var start = direction === "horizontal" ? lineBox.x : lineBox.y;
    var end = start + (direction === "horizontal" ? lineBox.width : lineBox.height);
    var values = [];

    // 重要：画像全体ではなく、検出した行・列の中だけで投影値を計算する
    for (var pos = start; pos < end; pos += 1) {
        var count = 0;

        if (direction === "horizontal") {
            for (var y = lineBox.y; y < lineBox.y + lineBox.height; y += 1) {
                if (mask[y * width + pos]) count += 1;
            }
        } else {
            for (var x = lineBox.x; x < lineBox.x + lineBox.width; x += 1) {
                if (mask[pos * width + x]) count += 1;
            }
        }
        values.push(count);
    }

    var maxValue = Math.max.apply(null, values);
    if (!maxValue) return [];

    var crossSize = direction === "horizontal" ? lineBox.height : lineBox.width;
    var valleyLimit = Math.max(1, maxValue * 0.08);
    var valleys = [];
    var valleyStart = -1;

    for (var i = 0; i < values.length; i += 1) {
        if (values[i] <= valleyLimit) {
            if (valleyStart === -1) valleyStart = i;
        } else if (valleyStart !== -1) {
            if (i - valleyStart >= 2) {
                valleys.push({
                    start: valleyStart,
                    end: i,
                    center: Math.floor((valleyStart + i) / 2)
                });
            }
            valleyStart = -1;
        }
    }
    if (valleyStart !== -1 && values.length - valleyStart >= 2) {
        valleys.push({
            start: valleyStart,
            end: values.length,
            center: Math.floor((valleyStart + values.length) / 2)
        });
    }

    // 文字幅の目安より極端に近い境界候補は採用しない
    var minDistance = Math.max(12, crossSize * 0.42);
    var boundaries = [0];

    valleys.forEach(function (valley) {
        var absolute = start + valley.center;
        var previous = boundaries[boundaries.length - 1];

        if (
            absolute - previous >= minDistance &&
            end - absolute >= minDistance
        ) {
            boundaries.push(absolute);
        }
    });

    boundaries.push(end);

    var boxes = [];
    for (var j = 0; j < boundaries.length - 1; j += 1) {
        var a = boundaries[j];
        var b = boundaries[j + 1];

        var candidate = direction === "horizontal"
            ? { x: a, y: lineBox.y, width: b - a, height: lineBox.height }
            : { x: lineBox.x, y: a, width: lineBox.width, height: b - a };

        var trimmed = trimBoxToInk(mask, width, height, candidate, 6);

        // 小さすぎる断片は文字として扱わない
        if (trimmed && trimmed.width >= 8 && trimmed.height >= 8) {
            boxes.push(trimmed);
        }
    }

    return boxes;
}


// 離れている線を同じ文字としてまとめる後処理
function mergeCharacterFragments(boxes, direction) {
    if (boxes.length < 2) return boxes.slice();

    var result = boxes.map(function (box) {
        return {
            x: box.x, y: box.y,
            width: box.width, height: box.height
        };
    });

    // 文字の標準サイズの目安として、各枠の短辺ではなく高さ/幅の中央値を使う
    var sizes = result.map(function (box) {
        return direction === "horizontal" ? box.height : box.width;
    }).sort(function (a, b) { return a - b; });
    var typicalSize = sizes[Math.floor(sizes.length / 2)] || 40;

    var changed = true;
    var safety = 0;

    while (changed && safety < 5) {
        changed = false;
        safety += 1;

        result.sort(function (a, b) {
            return direction === "horizontal" ? a.x - b.x : a.y - b.y;
        });

        for (var i = 0; i < result.length - 1; i += 1) {
            var a = result[i];
            var b = result[i + 1];

            var gap, overlap, minCross, combinedMain;
            if (direction === "horizontal") {
                gap = b.x - (a.x + a.width);
                overlap = Math.max(0, Math.min(a.y + a.height, b.y + b.height) - Math.max(a.y, b.y));
                minCross = Math.min(a.height, b.height);
                combinedMain = Math.max(a.x + a.width, b.x + b.width) - a.x;
            } else {
                gap = b.y - (a.y + a.height);
                overlap = Math.max(0, Math.min(a.x + a.width, b.x + b.width) - Math.max(a.x, b.x));
                minCross = Math.min(a.width, b.width);
                combinedMain = Math.max(a.y + a.height, b.y + b.height) - a.y;
            }

            // 小さな断片同士で、近くにあり、同じ文字サイズ内に収まる場合だけ結合
            var bothFragments =
                (direction === "horizontal"
                    ? a.width < typicalSize * 0.38 && b.width < typicalSize * 0.38
                    : a.height < typicalSize * 0.38 && b.height < typicalSize * 0.38);

            var sameCharacterBand = overlap >= minCross * 0.35;
            var closeEnough = gap >= -3 && gap <= typicalSize * 0.28;
            var fitsOneCharacter = combinedMain <= typicalSize * 0.78;

            if (bothFragments && sameCharacterBand && closeEnough && fitsOneCharacter) {
                var left = Math.min(a.x, b.x);
                var top = Math.min(a.y, b.y);
                var right = Math.max(a.x + a.width, b.x + b.width);
                var bottom = Math.max(a.y + a.height, b.y + b.height);

                result.splice(i, 2, {
                    x: left, y: top,
                    width: right - left,
                    height: bottom - top
                });
                changed = true;
                break;
            }
        }
    }

    return result;
}

// 近接する文字の枠が重なりすぎた場合、重なりを抑える
function separateOverlappingCharacterBoxes(boxes, direction) {
    var result = boxes.map(function (box) {
        return {
            x: box.x, y: box.y,
            width: box.width, height: box.height
        };
    });

    result.sort(function (a, b) {
        return direction === "horizontal" ? a.x - b.x : a.y - b.y;
    });

    for (var i = 0; i < result.length - 1; i += 1) {
        var a = result[i];
        var b = result[i + 1];

        if (direction === "horizontal") {
            var overlapX = (a.x + a.width) - b.x;
            if (overlapX > 0) {
                var boundary = Math.round((a.x + a.width + b.x) / 2);
                a.width = Math.max(1, boundary - a.x);
                b.width = Math.max(1, b.x + b.width - boundary);
                b.x = boundary;
            }
        } else {
            var overlapY = (a.y + a.height) - b.y;
            if (overlapY > 0) {
                var boundaryY = Math.round((a.y + a.height + b.y) / 2);
                a.height = Math.max(1, boundaryY - a.y);
                b.height = Math.max(1, b.y + b.height - boundaryY);
                b.y = boundaryY;
            }
        }
    }

    return result;
}

function runAutomaticSegmentation() {
    if (!previewImage) {
        setStatus("先に保存カードを選んでください。");
        return;
    }

    var direction = segmentationDirection.value;
    var width = previewCanvas.width;
    var height = previewCanvas.height;
    var imageData = previewCtx.getImageData(0, 0, width, height);
    var mask = getInkMask(imageData);

    // 文字のある行・列を検出する
    var lineProjection = new Array(direction === "horizontal" ? height : width).fill(0);

    for (var y = 0; y < height; y += 1) {
        for (var x = 0; x < width; x += 1) {
            if (mask[y * width + x]) {
                lineProjection[direction === "horizontal" ? y : x] += 1;
            }
        }
    }

    var maxLineValue = Math.max.apply(null, lineProjection);
    if (!maxLineValue) {
        setStatus("文字を検出できませんでした。");
        return;
    }

    // 1〜数ピクセルだけのノイズを避けるため、最大値に対する割合で行を検出
    var lineGroups = findProjectionGroups(
        lineProjection,
        Math.max(2, maxLineValue * 0.035),
        14
    );

    var detected = [];
    lineGroups.forEach(function (group) {
        var lineBox = direction === "horizontal"
            ? { x: 0, y: group.start, width: width, height: group.end - group.start }
            : { x: group.start, y: 0, width: group.end - group.start, height: height };

        var parts = splitLineIntoCharacters(mask, width, height, lineBox, direction);
        detected = detected.concat(parts);
    });

    // 横書きは上から下、縦書きは右から左の順に並べる
    detected.sort(function (a, b) {
        if (direction === "horizontal") {
            return Math.abs(a.y - b.y) > 20 ? a.y - b.y : a.x - b.x;
        }
        return Math.abs(a.x - b.x) > 20 ? b.x - a.x : a.y - b.y;
    });

    if (detected.length === 0) {
        setStatus("文字の範囲を推定できませんでした。手動で範囲選択してください。");
        return;
    }

    // 離れた短い線を同じ文字にまとめ、隣接する枠の重なりを調整
    detected = mergeCharacterFragments(detected, direction);
    detected = separateOverlappingCharacterBoxes(detected, direction);

    previewLayers = [];
    segmentationBoxes = [];

    detected.forEach(function (box) {
        var crop = createPreviewCrop(box);
        if (crop) {
            previewLayers.push(crop);
            segmentationBoxes.push(box);
        }
    });

    selectedSegmentationBox = -1;
    previewSelectedLayerIndex = -1;
    previewSelection = null;
    previewMode = "segmented";
    previewSelectionCanvas.style.pointerEvents = "auto";
    redrawPreviewOverlay();

    setStatus(
        segmentationBoxes.length +
        "個の範囲を推定しました。枠をクリックして選択し、キーボードに登録できます。"
    );
}

autoSegmentButton.addEventListener("click", runAutomaticSegmentation);


// 範囲選択用キャンバスのイベント
previewSelectionCanvas.addEventListener("pointerdown", function (event) {
    if (messageMode) return;

    if (previewMode === "segmented") {
        var point = getCanvasPoint(event, previewSelectionCanvas);
        var hitIndex = -1;

        // 後から描画した枠を優先して選択
        for (var i = segmentationBoxes.length - 1; i >= 0; i -= 1) {
            var box = segmentationBoxes[i];
            if (
                point.x >= box.x && point.x <= box.x + box.width &&
                point.y >= box.y && point.y <= box.y + box.height
            ) {
                hitIndex = i;
                break;
            }
        }

        if (hitIndex >= 0) {
            selectedSegmentationBox = hitIndex;
            previewSelectedLayerIndex = hitIndex;
            redrawPreviewOverlay();
            setStatus("範囲 " + (hitIndex + 1) + " を選択しました。「キーボードに登録」から登録できます。");
        }
        return;
    }

    if (previewMode !== "select") return;
    beginPreviewSelection(event);
});

previewSelectionCanvas.addEventListener("pointermove", function (event) {
    if (previewSelecting) {
        continuePreviewSelection(event);
    }
});

previewSelectionCanvas.addEventListener("pointerup", function (event) {
    if (previewSelecting) {
        stopPreviewSelection(event);
    }
});

previewSelectionCanvas.addEventListener("pointercancel", function (event) {
    if (previewSelecting) {
        stopPreviewSelection(event);
    }
});

previewSelectionCanvas.addEventListener("pointerleave", function (event) {
    if (previewSelecting) {
        stopPreviewSelection(event);
    }
});


// 範囲選択ボタン
previewSelectButton.addEventListener("click", function () {
    if (!previewImage) {
        setStatus("先に保存カードを選んでください。");
        return;
    }

    messageMode = false;
    messageCanvas.style.pointerEvents = "none";

    previewMode = "select";
    segmentationBoxes = [];
    selectedSegmentationBox = -1;
    previewSelectionCanvas.style.pointerEvents = "auto";

    toggleMessageButton.textContent = "メッセージを書く";

    redrawPreviewOverlay();

    setStatus("範囲選択を開始しました。");
});


// プレビューを閉じる
previewClearButton.addEventListener("click", function () {
    resetPreview();
    setStatus("プレビューを閉じました。");
});


// ------------------------------
// 手書き文字キーボード
// ------------------------------

try {
    registeredGlyphs = JSON.parse(
        localStorage.getItem(GLYPH_STORAGE_KEY) || "{}"
    );
} catch (error) {
    registeredGlyphs = {};
}

kanaKeys.forEach(function (kana) {
    var option = document.createElement("option");

    option.value = kana;
    option.textContent = kana;

    registerKana.appendChild(option);
});

function saveRegisteredGlyphs() {
    try {
        localStorage.setItem(
            GLYPH_STORAGE_KEY,
            JSON.stringify(registeredGlyphs)
        );

        return true;

    } catch (error) {
        setStatus(
            "登録データを保存できませんでした。ストレージ容量を確認してください。"
        );

        return false;
    }
}

function renderHandwritingKeyboard() {
    keyboardGrid.innerHTML = "";

    var keyboardRows = [
        ["っ","ゃ","ぱ","ば","だ","ざ","が","わ","ら","や","ま","は","な","た","さ","か","あ"],
        ["わ","","ぴ","び","ぢ","じ","ぎ","を","り","","み","ひ","に","ち","し","き","い"],
        ["","ゆ","ぷ","ぶ","づ","ず","ぐ","ん","る","ゆ","む","ふ","ぬ","つ","す","く","う"],
        ["","","ぺ","べ","で","ぜ","げ","","れ","","め","へ","ね","て","せ","け","え"],
        ["","よ","ぽ","ぼ","ど","ぞ","ご","","ろ","よ","も","ほ","の","と","そ","こ","お"]
    ];

    keyboardRows.forEach(function (row) {
        row.forEach(function (kana) {
            var key = document.createElement("button");

            key.type = "button";
            key.className = "keyboard-key";

            if (kana === "") {
                key.style.visibility = "hidden";
                key.disabled = true;
                key.setAttribute("aria-hidden", "true");

                keyboardGrid.appendChild(key);
                return;
            }

            var label = document.createElement("span");
            label.className = "key-label";
            label.textContent = kana;

            key.appendChild(label);

            var glyphs = registeredGlyphs[kana];

            if (glyphs && glyphs.length > 0) {
                var glyph = glyphs[glyphs.length - 1];

                key.classList.add("registered");

                var image = document.createElement("img");
                image.src = glyph.dataUrl;
                image.alt = kana + "の手書き文字";

                key.insertBefore(image, label);

                key.addEventListener("click", function () {
                    setStatus(
                        "「" + kana + "」は登録済みです。write.htmlで利用できます。"
                    );
                });

            } else {
                key.disabled = true;
            }

            keyboardGrid.appendChild(key);
        });
    });
}


// キーボード登録ボタン
registerKeyboardButton.addEventListener("click", function () {
    if (
        previewSelectedLayerIndex < 0 ||
        !previewLayers[previewSelectedLayerIndex]
    ) {
        setStatus(
            "先に保存カードを選択して、範囲を切り出してください。"
        );

        return;
    }

    registerTargetLayer =
        previewLayers[previewSelectedLayerIndex];

    registerDialog.classList.add("visible");
});

cancelRegisterButton.addEventListener("click", function () {
    registerDialog.classList.remove("visible");
    registerTargetLayer = null;
});

confirmRegisterButton.addEventListener("click", function () {
    if (!registerTargetLayer) {
        return;
    }

    var copyCanvas = document.createElement("canvas");

    copyCanvas.width = registerTargetLayer.canvas.width;
    copyCanvas.height = registerTargetLayer.canvas.height;

    copyCanvas.getContext("2d").drawImage(
        registerTargetLayer.canvas,
        0,
        0
    );

    var kana = registerKana.value;

    if (!registeredGlyphs[kana]) {
        registeredGlyphs[kana] = [];
    }

    registeredGlyphs[kana].push({
        dataUrl: copyCanvas.toDataURL("image/png"),
        savedAt: Date.now()
    });

    if (saveRegisteredGlyphs()) {
        renderHandwritingKeyboard();
        setStatus("「" + kana + "」をキーボードに登録しました。");
    }

    registerDialog.classList.remove("visible");
    registerTargetLayer = null;
});


// キーボード表示切り替え
toggleKeyboardButton.addEventListener("click", function () {
    var visible = keyboardPanel.classList.toggle("visible");

    toggleKeyboardButton.textContent =
        visible ? "キーボードを隠す" : "キーボードを表示";

    if (visible) {
        renderHandwritingKeyboard();
    }
});


// ------------------------------
// メッセージ機能
// ------------------------------

// メッセージを書くモードの切り替え
toggleMessageButton.addEventListener("click", function () {
    if (!previewImage) {
        setStatus("先に保存カードを選んでください。");
        return;
    }

    messageMode = !messageMode;

    messageCanvas.style.pointerEvents =
        messageMode && messageVisible ? "auto" : "none";

    // メッセージを書く間は範囲選択を無効にする
    previewSelectionCanvas.style.pointerEvents =
        messageMode
            ? "none"
            : (previewMode === "select" ? "auto" : "none");

    toggleMessageButton.textContent =
        messageMode
            ? "メッセージを書くのを終了"
            : "メッセージを書く";

    setStatus(
        messageMode
            ? "メッセージを書けます。カードの外側にも書き込めます。"
            : "メッセージ入力を終了しました。"
    );
});


// メッセージの表示・非表示
toggleMessageVisibilityButton.addEventListener("click", function () {
    messageVisible = !messageVisible;

    messageCanvas.style.display =
        messageVisible ? "block" : "none";

    messageCanvas.style.pointerEvents =
        messageMode && messageVisible ? "auto" : "none";

    toggleMessageVisibilityButton.textContent =
        messageVisible
            ? "メッセージを非表示"
            : "メッセージを表示";
});


// メッセージの描画開始
messageCanvas.addEventListener("pointerdown", function (event) {
    if (!messageMode || !messageVisible) {
        return;
    }

    event.preventDefault();

    messageDrawing = true;

    messageCanvas.setPointerCapture(event.pointerId);

    var point = getCanvasPoint(event, messageCanvas);

    messageCtx.beginPath();
    messageCtx.moveTo(point.x, point.y);

    messageCtx.lineWidth = 3;
    messageCtx.lineCap = "round";
    messageCtx.lineJoin = "round";
    messageCtx.strokeStyle = "#222";
});


// メッセージの描画中
messageCanvas.addEventListener("pointermove", function (event) {
    if (!messageDrawing) {
        return;
    }

    event.preventDefault();

    var point = getCanvasPoint(event, messageCanvas);

    messageCtx.lineTo(point.x, point.y);
    messageCtx.stroke();

    messageHasContent = true;
});


// 描画終了
function finishMessageDrawing(event) {
    if (!messageDrawing) {
        return;
    }

    messageDrawing = false;

    if (messageCanvas.hasPointerCapture(event.pointerId)) {
        messageCanvas.releasePointerCapture(event.pointerId);
    }
}

messageCanvas.addEventListener("pointerup", finishMessageDrawing);
messageCanvas.addEventListener("pointercancel", finishMessageDrawing);


// ------------------------------
// 初期化
// ------------------------------

loadSnapshotsFromStorage();
renderSnapshotList();
resetPreview();
renderHandwritingKeyboard();

</script>
</body>
</html>


<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>手書き文字を共有する</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f7f6f2;
            font-family: sans-serif;
            color: #333;
        }

        .container {
            width: 90%;
            max-width: 420px;
            padding: 35px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 2px 15px rgba(0,0,0,0.06);
        }

        h1 {
            text-align: center;
            font-size: 24px;
            margin-bottom: 10px;
        }

        .description {
            text-align: center;
            font-size: 13px;
            color: #888;
            margin-bottom: 30px;
        }

        .tabs {
            display: flex;
            margin-bottom: 25px;
            border-bottom: 1px solid #ddd;
        }

        .tab {
            flex: 1;
            padding: 12px;
            border: none;
            background: none;
            cursor: pointer;
            color: #999;
            font-size: 15px;
        }

        .tab.active {
            color: #333;
            border-bottom: 2px solid #555;
            font-weight: bold;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-size: 13px;
            margin-bottom: 7px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #888;
        }

        .main-button {
            width: 100%;
            padding: 13px;
            margin-top: 10px;
            border: none;
            border-radius: 6px;
            background: #555;
            color: white;
            font-size: 15px;
            cursor: pointer;
        }

        .main-button:hover {
            background: #333;
        }

        .main-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .message {
            margin-top: 15px;
            font-size: 13px;
            text-align: center;
            line-height: 1.6;
        }

        .hidden {
            display: none;
        }

        .note {
            font-size: 11px;
            color: #999;
            margin-top: 7px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>手書き文字を共有する</h1>

    <p class="description">
        自分や誰かの文字の魅力を見つけよう
    </p>

    <!-- タブ -->
    <div class="tabs">
        <button class="tab active" id="registerTab">
            新規登録
        </button>

        <button class="tab" id="loginTab">
            ログイン
        </button>
    </div>

    <!-- 新規登録 -->
    <div id="registerForm">

        <div class="form-group">
            <label>ニックネーム</label>

            <input
                type="text"
                id="registerNickname"
                placeholder="例：さくら"
                maxlength="12"
                autocomplete="username"
            >

            <p class="note">
                ひらがな1〜12文字で入力してください
            </p>
        </div>

        <div class="form-group">
            <label>パスワード</label>

            <input
                type="password"
                id="registerPassword"
                placeholder="8文字以上"
                autocomplete="new-password"
            >
        </div>

        <button class="main-button" id="registerButton">
            新規登録
        </button>

    </div>

    <!-- ログイン -->
    <div id="loginForm" class="hidden">

        <div class="form-group">
            <label>ニックネーム</label>

            <input
                type="text"
                id="loginNickname"
                placeholder="ニックネーム"
                maxlength="12"
                autocomplete="username"
            >
        </div>

        <div class="form-group">
            <label>パスワード</label>

            <input
                type="password"
                id="loginPassword"
                placeholder="パスワード"
                autocomplete="current-password"
            >
        </div>

        <button class="main-button" id="loginButton">
            ログイン
        </button>

    </div>

    <p class="message" id="message"></p>

</div>

<script>

// ===================================
// Supabase接続設定
// ===================================

const SUPABASE_URL = "https://anxztdqzqqptacyaxgum.supabase.co";
const SUPABASE_KEY = "sb_publishable_4X9evS2Q6xOqQyqfi8brMg_e-XUD2Dr";

const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


// ===================================
// 内部用メールアドレスの生成
// ===================================

function makeEmail(nickname) {

    const bytes = new TextEncoder().encode(nickname);

    const hex = Array.from(bytes)
        .map(byte => byte.toString(16).padStart(2, "0"))
        .join("");

    return "u-" + hex + "@users.example.com";
}


// ===================================
// メッセージ表示
// ===================================

function showMessage(text, isError = false) {

    const message = document.getElementById("message");

    message.textContent = text;

    message.style.color = isError ? "#d44" : "#39865b";
}


// ===================================
// ログイン済みか確認
// ===================================

async function checkLogin() {

    const { data, error } =
        await supabaseClient.auth.getSession();

    if (error) {
        showMessage("ログイン状態を確認できませんでした。", true);
        return;
    }

    if (data.session) {
        location.replace("write.html");
    }
}

checkLogin();


// ===================================
// タブ切り替え
// ===================================

const registerTab = document.getElementById("registerTab");
const loginTab = document.getElementById("loginTab");

registerTab.addEventListener("click", () => {

    document.getElementById("registerForm").classList.remove("hidden");
    document.getElementById("loginForm").classList.add("hidden");

    registerTab.classList.add("active");
    loginTab.classList.remove("active");

    showMessage("");
});

loginTab.addEventListener("click", () => {

    document.getElementById("registerForm").classList.add("hidden");
    document.getElementById("loginForm").classList.remove("hidden");

    loginTab.classList.add("active");
    registerTab.classList.remove("active");

    showMessage("");
});


// ===================================
// ニックネームのチェック
// ===================================

function isValidNickname(nickname) {

    return /^[ぁ-ゖゝゞー]{1,12}$/u.test(nickname);
}


// ===================================
// 新規登録
// ===================================

document.getElementById("registerButton")
.addEventListener("click", register);

async function register() {

    const nickname = document
        .getElementById("registerNickname")
        .value.trim()
        .normalize("NFC");

    const password = document
        .getElementById("registerPassword")
        .value;

    if (!isValidNickname(nickname)) {

        showMessage(
            "ニックネームはひらがな1〜12文字で入力してください。",
            true
        );

        return;
    }

    if (password.length < 8) {

        showMessage(
            "パスワードは8文字以上にしてください。",
            true
        );

        return;
    }

    const button = document.getElementById("registerButton");

    button.disabled = true;
    button.textContent = "登録中...";

    try {

        const email = makeEmail(nickname);

        const { data, error } =
            await supabaseClient.auth.signUp({

                email: email,
                password: password,

                options: {
                    data: {
                        nickname: nickname
                    }
                }
            });

        if (error) {
            showMessage(
                "登録できませんでした。ニックネームが使用済みか、入力内容をご確認ください。",
                true
            );
            return;
        }

        if (!data.session) {
            showMessage(
                "登録できましたが、ログインセッションがありません。Email確認設定がOFFか確認してください。",
                true
            );
            return;
        }

        showMessage("登録しました！");

        location.replace("write.html");

    } catch (error) {

        console.error(error);

        showMessage("エラーが発生しました。", true);

    } finally {

        button.disabled = false;
        button.textContent = "新規登録";
    }
}


// ===================================
// ログイン
// ===================================

document.getElementById("loginButton")
.addEventListener("click", login);

async function login() {

    const nickname = document
        .getElementById("loginNickname")
        .value.trim()
        .normalize("NFC");

    const password = document
        .getElementById("loginPassword")
        .value;

    if (!isValidNickname(nickname)) {

        showMessage(
            "ニックネームを正しく入力してください。",
            true
        );

        return;
    }

    if (!password) {

        showMessage("パスワードを入力してください。", true);

        return;
    }

    const button = document.getElementById("loginButton");

    button.disabled = true;
    button.textContent = "ログイン中...";

    try {

        const email = makeEmail(nickname);

        const { data, error } =
            await supabaseClient.auth.signInWithPassword({

                email: email,
                password: password
            });

        if (error) {

            showMessage(
                "ニックネームまたはパスワードが違います。",
                true
            );

            return;
        }

        showMessage("ログインしました！");

        location.replace("write.html");

    } catch (error) {

        console.error(error);

        showMessage("エラーが発生しました。", true);

    } finally {

        button.disabled = false;
        button.textContent = "ログイン";
    }
}

</script>

</body>
</html>

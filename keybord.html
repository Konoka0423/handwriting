
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>メッセージと文字を交換するサイト</title>

<style>
:root {
    color-scheme: light;
    --bg: #e5e5e5;
    --panel: #ffffff;
    --ink: #1d1d1f;
    --muted: #6b7280;
    --line: #d6d3cc;
    --accent: #626262;
    --accent-soft: #fbfbfb;
}

body {
    margin: 0;
    font-family: "ヒラギノ丸ゴ Pro", serif;
    color: var(--ink);
    background: #F2F1F1;
}

main {
    max-width: 1180px;
    margin: 0 auto;
    padding: 24px 16px 40px;
}

header {
    margin-bottom: 18px;
}

header h1 {
    margin: 0;
    font-size: clamp(1.8rem, 3vw, 2.6rem);
    letter-spacing: 0.04em;
}

.status {
    width: min(100%, 960px);
    margin: 8px auto 16px;
    color: var(--muted);
    text-align: center;
    font-size: 0.95rem;
}

.gallery {
    margin-top: 10px;
    padding: 18px;
}

button {
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 11px 18px;
    font-size: 1rem;
    line-height: 1;
    color: var(--ink);
    background: #ebebeb;
    cursor: pointer;
    transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
}

button:hover {
    transform: translateY(-1px);
    box-shadow: 0 8px 18px rgba(15, 23, 42, 0.08);
}

button:active {
    color: var(--accent-soft);
    background: var(--accent);
    border-color: var(--accent-soft);
}

button.active {
    color: var(--accent-soft);
    background: var(--accent);
    border-color: var(--accent-soft);
}

.snapshot-list {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 14px;
}

.snapshot-item {
    border: 1px solid var(--line);
    border-radius: 16px;
    background: rgba(255, 255, 255, 0.92);
    padding: 12px;
}

.snapshot-meta {
    display: flex;
    justify-content: space-between;
    gap: 8px;
    align-items: center;
    margin-bottom: 10px;
    font-size: 0.92rem;
}

.snapshot-title {
    font-weight: 700;
}

.snapshot-preview {
    display: grid;
    place-items: center;
    min-height: 160px;
    border: 1px solid #e5e7eb;
    border-radius: 14px;
    background: #fbfbfb;
    overflow: hidden;
}

.snapshot-preview img {
    display: block;
    max-width: 100%;
    max-height: 240px;
    object-fit: contain;
}

.empty {
    color: var(--muted);
    text-align: center;
    padding: 28px 0;
}

.preview-panel {
    display: none;
    margin-top: 18px;
    padding: 18px;
    border-radius: 16px;
    background: rgba(255, 255, 255, 0.7);
}

.preview-panel h2 {
    margin: 0 0 12px;
}

/* 左の操作ボタンと右のキャンバスを横並びにする */
.preview-layout {
    display: flex;
    align-items: center;
    gap: 32px;
    width: 100%;
    margin: 0 auto;
}

/* 左側の操作ボタン */
.preview-tools {
    flex: 0 0 120px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
}

.preview-tools button {
    width: 100px;
    height: 80px;
    padding: 14px 8px;
    border-radius: 5px;
}

.preview-line-tools {
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
}

.preview-line-tools button {
    width: 100px;
    height: 48px;
    padding: 8px 5px;
    border-radius: 5px;
}

/* 右側のキャンバス領域 */
.preview-shell {
    position: relative;
    flex: 1;
    min-width: 0;
    width: auto;
    margin: 0;
    aspect-ratio: 11 / 7;
    border: 1px solid var(--line);
    border-radius: 18px;
    overflow: hidden;
}

/* キャンバスの見出し */
.preview-title {
    position: absolute;
    top: 4%;
    left: 0;
    width: 100%;
    margin: 0;
    text-align: center;
    font-size: clamp(1.4rem, 3vw, 2.6rem);
    z-index: 4;
}

/* 中央のカード領域 */
.card-area {
    position: absolute;
    left: 9.09%;
    top: 23%;
    width: 81.82%;
    height: 65%;
    background: trasparent;
}

/* カード本体と範囲選択用キャンバス */
.card-area canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    touch-action: none;
}

/* 範囲選択・部分消去用キャンバスを最前面に配置 */
#previewSelectionCanvas {
    position: absolute;
    inset: 0;
    z-index: 20;
    pointer-events: none;
    touch-action: none;
}

/* 青い範囲選択枠専用。消去操作で消えない独立レイヤー */
#previewOutlineCanvas {
    position: absolute;
    inset: 0;
    z-index: 21;
    width: 100%;
    height: 100%;
    display: block;
    pointer-events: none;
}

/* メッセージ用キャンバス */
#messageCanvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    touch-action: none;
    pointer-events: none;
    z-index: 3;
}

/* 右上のボタン2つ */
.preview-corner-buttons {
    position: absolute;
    top: 12px;
    right: 12px;
    z-index: 5;
    display: flex;
    align-items: center;
    gap: 8px;
}

/* メッセージ表示切り替えボタン */
.preview-corner-buttons button {
    padding: 9px 14px;
    font-size: 0.9rem;
}

/* ×ボタン */
.preview-corner-buttons .close-preview {
    width: 38px;
    height: 38px;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 26px;
    border-radius: 50%;
}

/* カード本体と範囲選択用キャンバス */
.card-area canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    touch-action: none;
}

/* メッセージ用キャンバス */
#messageCanvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    touch-action: none;
    pointer-events: none;
    z-index: 3;
}

.preview-controls {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px;
    margin-top: 14px;
}

.keyboard-tools {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px;
    margin: 0 0 14px;
}

#keyboardPanel {
    display: none;
    position: relative;
    z-index: 6;
    margin: 14px 0 24px;
    padding: 16px;
    border: 1px solid var(--line);
    border-radius: 14px;
    background: #fff;
    overflow-x: auto;
}

#keyboardPanel.visible {
    display: block;
}

.keyboard-grid {
    display: grid;
    grid-template-columns: repeat(17, minmax(0, 1fr));
    gap: 4px;
    min-width: 720px;
}

.keyboard-key {
    min-width: 0;
    min-height: 42px;
    padding: 3px 1px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    border: 1px solid #ccc;
    border-radius: 3px;
    background: #e5e5e5;
    color: #222;
}

.keyboard-key .key-label {
    font-size: 16px;
}

.keyboard-key img {
    width: 28px;
    height: 28px;
    object-fit: contain;
}

.keyboard-key.registered {
    background: #fff;
    border-color: #6b7280;
}

.keyboard-key:disabled {
    opacity: 0.5;
    background: #f3f4f6;
    cursor: not-allowed;
}

#registerDialog {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 1000;
    background: #0008;
    align-items: center;
    justify-content: center;
    padding: 16px;
}

#registerDialog.visible {
    display: flex;
}

.register-box {
    width: min(420px, 100%);
    background: #fff;
    border-radius: 14px;
    padding: 22px;
    box-shadow: 0 10px 40px #0003;
}

.register-box select {
    width: 100%;
    padding: 12px;
    margin: 12px 0;
    font-size: 18px;
}

.register-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: flex-end;
}

.site-header {
    position: sticky;
    top: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 24px;
    width: 100%;
    box-sizing: border-box;
    padding: 12px max(16px, calc((100vw - 1180px) / 2 + 16px));
    background: var(--bg);
    border-bottom: 1px solid rgba(214, 211, 204, 0.85);
}

.site-header header {
    min-width: 0;
    margin: 0;
}

.site-header h1 {
    font-size: clamp(1.25rem, 2.3vw, 2rem);
}

.site-nav {
    flex: 0 0 auto;
    width: 400px;
    margin: 0;
    padding: 6px;
    display: flex;
    gap: 8px;
    border: 1px solid #dedede;
    border-radius: 16px;
    background: #f7f7f7;
    box-sizing: border-box;
}

.site-nav a {
    flex: 1;
    min-width: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 13px 10px;
    border-radius: 11px;
    text-decoration: none;
    color: #333;
    font-size: 15px;
    font-weight: 600;
    text-align: center;
    transition: background 0.15s ease, color 0.15s ease;
}

.site-nav a.active {
    background: #414141;
    color: var(--accent-soft);
}

.site-nav .nav-icon {
    font-size: 18px;
    line-height: 1;
}

@media (max-width: 600px) {
    .keyboard-grid {
        grid-template-columns: repeat(18, minmax(0, 1fr));
    }
}

@media (max-width: 760px) {
    .site-header {
        gap: 12px;
        padding: 10px 12px;
    }

    .site-header h1 {
        font-size: clamp(1.05rem, 3.5vw, 1.5rem);
    }

    .site-nav {
        padding: 5px;
        gap: 5px;
    }

    .site-nav a {
        padding: 10px 8px;
        gap: 5px;
        font-size: 13px;
    }

    .site-nav .nav-icon {
        display: none;
    }
}

@media (max-width: 520px) {
    .site-header {
        align-items: flex-start;
        flex-direction: column;
        gap: 8px;
    }

    .site-nav {
        width: 100%;
    }

    .site-nav a {
        flex: 1;
    }
}

* {
  font-family: "ヒラギノ丸ゴ Pro", serif !important;
}



/* ログイン・アカウントメニュー */
body.auth-pending { visibility: hidden; }
.site-header { position: sticky; }
.site-header > header { position: relative; }
.site-title-button {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 0;
    border: 0;
    border-radius: 0;
    background: transparent;
    color: var(--ink, #1d1d1f);
    box-shadow: none;
    transform: none;
    font: inherit;
    cursor: pointer;
    text-align: left;
}
.site-title-button:hover,
.site-title-button:active {
    background: transparent;
    color: var(--ink, #1d1d1f);
    border: 0;
    box-shadow: none;
    transform: none;
}
.site-title-text {
    display: inline-block;
    margin: 0;
    font-size: clamp(1.25rem, 2.3vw, 2rem);
    letter-spacing: 0.04em;
}
.site-title-chevron {
    font-size: 16px;
    color: #666;
    transition: transform .18s ease;
}
.site-title-button[aria-expanded="true"] .site-title-chevron {
    transform: rotate(180deg);
}
.account-menu {
    position: absolute;
    top: calc(100% + 10px);
    left: max(16px, calc((100vw - 1180px) / 2 + 16px));
    z-index: 300;
    width: min(280px, calc(100vw - 32px));
    padding: 14px;
    border: 1px solid #dedede;
    border-radius: 14px;
    background: #fff;
    box-shadow: 0 8px 28px rgba(0,0,0,.13);
}
.account-menu[hidden] { display: none; }
.account-menu-user {
    padding: 4px 8px 12px;
    margin-bottom: 8px;
    border-bottom: 1px solid #eee;
    color: #666;
    font-size: 13px;
}
.account-menu button {
    display: block;
    width: 100%;
    padding: 12px 10px;
    border: 0;
    border-radius: 8px;
    background: transparent;
    text-align: left;
    font-size: 14px;
    box-shadow: none;
    transform: none;
}
.account-menu button:hover { background: #f2f2f2; box-shadow: none; transform: none; }
.account-menu button.logout { color: #a33; }
@media (max-width: 760px) {
    .account-menu { left: 12px; }
    .site-title-text { font-size: clamp(1.05rem, 3.5vw, 1.5rem); }
}


/* グループ機能の案内 */
.group-notice {
    position: fixed;
    inset: 0;
    z-index: 1200;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background: rgba(0,0,0,.42);
}
.group-notice.visible { display: flex; }
.group-notice-box {
    width: min(420px, 100%);
    box-sizing: border-box;
    padding: 24px;
    border-radius: 16px;
    background: #fff;
    box-shadow: 0 12px 40px rgba(0,0,0,.18);
}
.group-notice-box h2 { margin: 0 0 12px; font-size: 1.25rem; }
.group-notice-box p { line-height: 1.7; overflow-wrap: anywhere; }
.group-notice-code {
    padding: 12px;
    border: 1px dashed #999;
    border-radius: 8px;
    background: #f7f7f7;
    font-size: 1.25rem;
    font-weight: 700;
    letter-spacing: .12em;
    text-align: center;
    user-select: all;
}
.group-notice-actions { display:flex; justify-content:flex-end; gap:8px; margin-top:18px; }
.group-notice-actions button { min-width: 90px; }

/* アカウントメニュー内のグループ一覧 */
.account-group-section {
    padding-bottom: 10px;
    margin-bottom: 8px;
    border-bottom: 1px solid #eee;
}

.account-group-label {
    padding: 4px 8px 8px;
    font-size: 12px;
    color: #888;
}

.account-group-empty {
    padding: 10px 8px;
    font-size: 13px;
    color: #999;
}

#accountGroupList {
    display: flex;
    flex-direction: column;
    gap: 3px;
    max-height: 240px;
    overflow-y: auto;
}

/* 選択されていないグループ */
.account-menu .account-group-button {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    color: #888;
    font-weight: normal;
    background: transparent;
}

/* 現在選択中のグループ */
.account-menu .account-group-button.active {
    color: #222;
    font-weight: bold;
    background: #eeeeee;
}

/* 選択中のチェックマーク */
.account-group-check {
    font-size: 14px;
    flex-shrink: 0;
}

</style>

</head>


<body class="auth-pending">
<div class="site-header">
    <header>
        <button type="button" id="siteTitleButton" class="site-title-button" aria-expanded="false" aria-controls="accountMenu">
            <span class="site-title-text">メッセージと文字を交換するサイト</span>
            <span class="site-title-chevron" aria-hidden="true">⌄</span>
        </button>
    </header>

    <nav class="site-nav" aria-label="メインナビゲーション">
        <a href="write.html">
            <span class="nav-icon">✎</span>
            <span>メッセージを書く</span>
        </a>
        <a href="keybord.html" class="active">
            <span class="nav-icon">▤</span>
            <span>みんなのメッセージ</span>
        </a>
    </nav>

<div id="accountMenu" class="account-menu" hidden>
    <div class="account-menu-user" id="accountMenuUser">ログイン中</div>
    <div class="account-group-section">
        <div class="account-group-label">参加中のグループ</div>
        <div id="accountGroupList">
            <div class="account-group-empty">読み込み中...</div>
        </div>
    </div>
    <button type="button" id="createGroupMenuButton">＋ グループを作成</button>
    <button type="button" id="joinGroupMenuButton">↗ グループに参加</button>
    <button type="button" id="logoutMenuButton" class="logout">ログアウト</button>
</div>
</div>


<div id="groupNotice" class="group-notice" role="dialog" aria-modal="true" aria-labelledby="groupNoticeTitle">
  <div class="group-notice-box">
    <h2 id="groupNoticeTitle">グループ</h2>
    <div id="groupNoticeBody"></div>
    <div class="group-notice-actions">
      <button type="button" id="groupNoticeClose">閉じる</button>
    </div>
  </div>
</div>

<main>
    <div id="status" class="status">
        カードを選ぶと、メッセージを書いたり範囲選択してキーボードへ登録したりできます。
    </div>

    
    <section id="previewPanel" class="preview-panel">
        <h2>選択したカード</h2>

        <div class="preview-layout">

            <!-- 左側の操作ボタン -->
            <div class="preview-tools">
                <button id="previewSelect">範囲選択</button>
                <div id="previewLineTools" class="preview-line-tools" style="display:none;">
                    <button type="button" id="previewErase">線を消す</button>
                    <button type="button" id="previewAdd">線を追加</button>
                </div>
                <button type="button" id="registerKeyboard">キーボードに登録</button>
                <button type="button" id="toggleKeyboard">キーボードを表示</button>
                <button type="button" id="toggleMessage" disabled>メッセージを書く</button>
            </div>

            <!-- キャンバス部分 -->
            <div class="preview-shell">

                <div class="card-area">
                    <canvas id="previewCanvas" width="900" height="540"></canvas>
                    <canvas id="previewSelectionCanvas" width="900" height="540"></canvas>
                    <canvas id="previewOutlineCanvas" width="900" height="540"></canvas>
                </div>

                <canvas id="messageCanvas" width="1100" height="700"></canvas>

                <!-- 右上の操作ボタン -->
                <div class="preview-corner-buttons">
                    <button type="button" id="toggleMessageVisibility">
                        メッセージを非表示
                    </button>

                    <button type="button" id="previewClear"
                            class="close-preview" aria-label="プレビューを閉じる">
                        ×
                    </button>
                </div>

            </div>
        </div>
    </section>


    <section id="keyboardPanel" aria-label="手書き文字キーボード">
        <div id="keyboardGrid" class="keyboard-grid"></div>
    </section>

    <div id="registerDialog" role="dialog" aria-modal="true" aria-labelledby="registerTitle">
        <div class="register-box">
            <h2 id="registerTitle">登録する文字を選択</h2>
            <p>選択した文字を、どのひらがなとして登録するか選んでください。</p>
            <select id="registerKana" aria-label="登録するひらがな"></select>
            <div class="register-actions">
                <button type="button" id="cancelRegister">キャンセル</button>
                <button type="button" id="confirmRegister">登録する</button>
            </div>
        </div>
    </div>

    <section class="gallery">
    <div class="gallery-header">
        <h2>保存したカード</h2>
        <button type="button" id="resetAllButton" class="destructive" hidden>
            すべてリセット
        </button>
    </div>

    <div id="snapshotList" class="snapshot-list">
        <div id="snapshotEmpty" class="empty">
            まだ保存されていません。
        </div>
    </div>
</section>
</main>

<script>
var SAVED_CARD_STORAGE_KEY = "sharedSavedCards_v1";
var GLYPH_STORAGE_KEY = "handwritingKeyboardGlyphs_v1";

var status = document.getElementById("status");
var snapshotList = document.getElementById("snapshotList");
var snapshotEmpty = document.getElementById("snapshotEmpty");
var previewPanel = document.getElementById("previewPanel");

var previewCanvas = document.getElementById("previewCanvas");
var previewSelectionCanvas = document.getElementById("previewSelectionCanvas");
var previewCtx = previewCanvas.getContext("2d");
var previewSelectionCtx = previewSelectionCanvas.getContext("2d");
var previewOutlineCanvas = document.getElementById("previewOutlineCanvas");
var previewOutlineCtx = previewOutlineCanvas.getContext("2d");

var messageCanvas = document.getElementById("messageCanvas");
var messageCtx = messageCanvas.getContext("2d");

var toggleMessageButton = document.getElementById("toggleMessage");
// モード切り替えボタンの青色表示を管理
function setPreviewActiveButton(activeButton) {
    [previewSelectButton, previewEraseButton, previewAddButton, toggleMessageButton].forEach(function (button) {
        button.classList.toggle("active", button === activeButton);
    });
}
var toggleMessageVisibilityButton =
    document.getElementById("toggleMessageVisibility");

var messageVisible = true;
var messageDrawing = false;
var messageHasContent = false;
var messageMode = false;

var previewSelectButton = document.getElementById("previewSelect");
var previewEraseButton = document.getElementById("previewErase");
var previewAddButton = document.getElementById("previewAdd");
var previewLineTools = document.getElementById("previewLineTools");
var previewClearButton = document.getElementById("previewClear");
var registerKeyboardButton = document.getElementById("registerKeyboard");
var toggleKeyboardButton = document.getElementById("toggleKeyboard");

var keyboardPanel = document.getElementById("keyboardPanel");
var keyboardGrid = document.getElementById("keyboardGrid");

var registerDialog = document.getElementById("registerDialog");
var registerKana = document.getElementById("registerKana");
var confirmRegisterButton = document.getElementById("confirmRegister");
var cancelRegisterButton = document.getElementById("cancelRegister");

var snapshots = [];
var previewImage = null;
var currentSnapshot = null; // 現在表示しているカード
var previewLayers = [];
var previewSelectedLayerIndex = -1;
var previewSelecting = false;
var previewSelection = null;
var previewSelectionStart = null;
var previewMode = "idle";
var previewErasing = false;
var previewEraseLastPoint = null;
var previewPaintMode = null;

function setStatus(message) {

function getCanvasPoint(event, targetCanvas) {
    var rect = targetCanvas.getBoundingClientRect();

    var scaleX = targetCanvas.width / rect.width;
    var scaleY = targetCanvas.height / rect.height;

    return {
        x: (event.clientX - rect.left) * scaleX,
        y: (event.clientY - rect.top) * scaleY
    };
}

function normalizeRect(start, end) {
    return {
        x: Math.min(start.x, end.x),
        y: Math.min(start.y, end.y),
        width: Math.abs(end.x - start.x),
        height: Math.abs(end.y - start.y)
    };
}

// カード読み込み処理の管理
let cardLoadVersion = 0;

// Supabaseから選択中のグループのカードを取得
async function loadSnapshotsFromSupabase() {

    const loadVersion = ++cardLoadVersion;
    const groupId = window.currentGroupId;

    // 前のグループのカード・プレビューを消す
    resetPreview();
    snapshots = [];
    renderSnapshotList();

    if (!groupId) {
        snapshotEmpty.textContent =
            "グループを作成するか、グループに参加してください。";
        return;
    }

    snapshotEmpty.textContent = "カードを読み込み中...";

    try {

        // 選択中のグループのカード情報を取得
        const { data, error } =
            await window.supabaseClient
                .from("cards")
                .select("*")
                .eq("group_id", groupId)
                .order("created_at", {
                    ascending: false
                });

        if (error) {
            throw error;
        }

        // Storageから画像を取得
        const loadedSnapshots = await Promise.all(
            (data || []).map(async function (card) {

                const { data: imageBlob, error: imageError } =
                    await window.supabaseClient.storage
                        .from("card")
                        .download(card.image_path);

                if (imageError) {
                    throw imageError;
                }

                // 画像を既存のキャンバスで扱える形式に変換
                const dataUrl = await new Promise(
                    function (resolve, reject) {

                        const reader = new FileReader();

                        reader.onload = function () {
                            resolve(reader.result);
                        };

                        reader.onerror = reject;

                        reader.readAsDataURL(imageBlob);
                    }
                );

                return {
                    id: card.id,
                    groupId: card.group_id,
                    dataUrl: dataUrl,
                    imagePath: card.image_path,
                    width: card.width,
                    height: card.height,
                    authorId: card.author_id,
                    authorNickname: card.author_nickname,
                    messageDataUrl: "",
                    messageImagePath: card.message_image_path
                };
            })
        );

        // 読み込み中にグループが切り替わった場合は反映しない
        if (
            loadVersion !== cardLoadVersion ||
            groupId !== window.currentGroupId
        ) {
            return;
        }

        snapshots = loadedSnapshots;

        snapshotEmpty.textContent =
            "このグループにはまだカードがありません。";

        renderSnapshotList();

        setStatus(
            "「" + window.currentGroupName +
            "」のカードを表示しています。"
        );

    } catch (error) {

        if (loadVersion !== cardLoadVersion) {
            return;
        }

        console.error("カード読み込みエラー:", error);

        snapshots = [];

        snapshotEmpty.textContent =
            "カードを読み込めませんでした。";

        renderSnapshotList();

        setStatus("カードの読み込みに失敗しました。");
    }
}

function updateSnapshotEmptyState() {
    snapshotEmpty.style.display =
        snapshots.length === 0 ? "grid" : "none";
}

function renderSnapshotList() {
    snapshotList.innerHTML = "";

    if (snapshots.length === 0) {
        snapshotList.appendChild(snapshotEmpty);
        updateSnapshotEmptyState();
        return;
    }

    snapshots.forEach(function (snapshot, index) {
        var item = document.createElement("article");
        item.className = "snapshot-item";
        item.title = "クリックして選択カードを表示";
        item.style.cursor = "pointer";

        var meta = document.createElement("div");
        meta.className = "snapshot-meta";

        var title = document.createElement("div");
        title.className = "snapshot-title";
        // 現在ログイン中の人ではなく、カード保存時に記録した投稿者名を表示
        var nickname = snapshot.authorNickname || "投稿者未記録";
        title.textContent = nickname + "からのメッセージ";

        meta.appendChild(title);

        var preview = document.createElement("div");
        preview.className = "snapshot-preview";

        var img = document.createElement("img");
        img.src = snapshot.dataUrl;
        img.alt = "保存したカード " + (index + 1);

        preview.appendChild(img);
        item.appendChild(meta);
        item.appendChild(preview);

        item.addEventListener("click", function () {
            showSnapshotPreview(snapshot);
        });

        snapshotList.appendChild(item);
    });
}

function clearPreviewOverlay() {
    previewSelectionCtx.clearRect(
        0,
        0,
        previewSelectionCanvas.width,
        previewSelectionCanvas.height
    );
}

function drawPreviewLayer(layer) {
    previewSelectionCtx.drawImage(
        layer.canvas,
        layer.x,
        layer.y
    );
}

function redrawPreviewOverlay() {
    clearPreviewOverlay();

    // 切り出した文字画像を描画する
    for (var index = 0; index < previewLayers.length; index += 1) {
        drawPreviewLayer(previewLayers[index]);
    }

    // 青い範囲選択枠は専用キャンバスに描画する
    previewOutlineCtx.clearRect(
        0,
        0,
        previewOutlineCanvas.width,
        previewOutlineCanvas.height
    );

    if (
        (previewMode === "select" || previewMode === "erase" || previewMode === "add") &&
        previewSelection
    ) {
        previewOutlineCtx.save();
        previewOutlineCtx.strokeStyle = "rgba(37, 99, 235, 0.95)";
        previewOutlineCtx.fillStyle = "rgba(37, 99, 235, 0.10)";
        previewOutlineCtx.lineWidth = 2;
        previewOutlineCtx.setLineDash([8, 6]);

        previewOutlineCtx.fillRect(
            previewSelection.x,
            previewSelection.y,
            previewSelection.width,
            previewSelection.height
        );
        previewOutlineCtx.strokeRect(
            previewSelection.x,
            previewSelection.y,
            previewSelection.width,
            previewSelection.height
        );
        previewOutlineCtx.restore();

        // 切り出した文字の「実際に描画されている部分」を赤い輪郭で表示
        // 部分消去すると元画像の透明部分が増えるため、赤枠もその場で消える
        var activeLayer = previewLayers[previewSelectedLayerIndex];

        if (activeLayer && activeLayer.canvas) {
            var layerCanvas = activeLayer.canvas;
            var layerCtx = layerCanvas.getContext("2d");
            var layerWidth = layerCanvas.width;
            var layerHeight = layerCanvas.height;
            var sourcePixels = layerCtx.getImageData(
                0, 0, layerWidth, layerHeight
            );
            var sourceData = sourcePixels.data;
            var outlinePixels = previewOutlineCtx.createImageData(
                layerWidth, layerHeight
            );
            var outlineData = outlinePixels.data;

            // 周囲8方向のどこかが透明なら、描画部分の輪郭とみなす
            for (var py = 0; py < layerHeight; py += 1) {
                for (var px = 0; px < layerWidth; px += 1) {
                    var pixelIndex = (py * layerWidth + px) * 4;
                    var alpha = sourceData[pixelIndex + 3];

                    if (alpha < 20) continue;

                    var isEdge = false;

                    for (var oy = -1; oy <= 1 && !isEdge; oy += 1) {
                        for (var ox = -1; ox <= 1; ox += 1) {
                            if (ox === 0 && oy === 0) continue;

                            var nx = px + ox;
                            var ny = py + oy;

                            if (
                                nx < 0 || ny < 0 ||
                                nx >= layerWidth || ny >= layerHeight
                            ) {
                                isEdge = true;
                                break;
                            }

                            var neighborAlpha =
                                sourceData[(ny * layerWidth + nx) * 4 + 3];

                            if (neighborAlpha < 20) {
                                isEdge = true;
                                break;
                            }
                        }
                    }

                    if (isEdge) {
                        outlineData[pixelIndex] = 235;     // 赤
                        outlineData[pixelIndex + 1] = 45;
                        outlineData[pixelIndex + 2] = 45;
                        outlineData[pixelIndex + 3] = 230;
                    }
                }
            }

            var outlineTempCanvas = document.createElement("canvas");
            outlineTempCanvas.width = layerWidth;
            outlineTempCanvas.height = layerHeight;
            outlineTempCanvas.getContext("2d").putImageData(
                outlinePixels, 0, 0
            );

            previewOutlineCtx.drawImage(
                outlineTempCanvas,
                activeLayer.x,
                activeLayer.y
            );
        }
    }
}

function createPreviewCrop(rect) {
    if (!previewImage) {
        return null;
    }

    var left = Math.max(0, Math.floor(rect.x));
    var top = Math.max(0, Math.floor(rect.y));

    var width = Math.min(
        previewCanvas.width - left,
        Math.ceil(rect.width)
    );

    var height = Math.min(
        previewCanvas.height - top,
        Math.ceil(rect.height)
    );

    if (width <= 0 || height <= 0) {
        return null;
    }

    var cropCanvas = document.createElement("canvas");
    cropCanvas.width = width;
    cropCanvas.height = height;

    var cropCtx = cropCanvas.getContext("2d");

    var sourceImageData = previewCtx.getImageData(
        left,
        top,
        width,
        height
    );

    var pixels = sourceImageData.data;

    for (var index = 0; index < pixels.length; index += 4) {
        var r = pixels[index];
        var g = pixels[index + 1];
        var b = pixels[index + 2];

        if (r > 250 && g > 250 && b > 250) {
            pixels[index + 3] = 0;
        }
    }

    cropCtx.putImageData(sourceImageData, 0, 0);

    return {
        canvas: cropCanvas,
        width: width,
        height: height,
        x: left,
        y: top
    };
}

function cutPreviewSelection() {
    if (
        !previewSelection ||
        previewSelection.width < 2 ||
        previewSelection.height < 2
    ) {
        setStatus("範囲が小さすぎます。もう一度選んでください。");
        return;
    }

    var crop = createPreviewCrop(previewSelection);

    if (!crop) {
        setStatus("選択した範囲から切り出せませんでした。");
        return;
    }

    previewLayers.push(crop);
    previewSelectedLayerIndex = previewLayers.length - 1;

    previewSelecting = false;

    previewSelection = {
        x: previewSelection.x,
        y: previewSelection.y,
        width: previewSelection.width,
        height: previewSelection.height
    };

    previewSelectionStart = null;
    previewMode = "select";

    redrawPreviewOverlay();

    setStatus("範囲を切り出しました。キーボードに登録できます。");
}

function beginPreviewSelection(event) {
    previewSelecting = true;

    previewSelectionCanvas.setPointerCapture(event.pointerId);

    var point = getCanvasPoint(
        event,
        previewSelectionCanvas
    );

    previewSelectionStart = point;

    previewSelection = {
        x: point.x,
        y: point.y,
        width: 0,
        height: 0
    };

    redrawPreviewOverlay();
}

function continuePreviewSelection(event) {
    if (!previewSelecting) {
        return;
    }

    previewSelection = normalizeRect(
        previewSelectionStart,
        getCanvasPoint(event, previewSelectionCanvas)
    );

    redrawPreviewOverlay();
}

function stopPreviewSelection(event) {
    if (!previewSelecting) {
        return;
    }

    previewSelecting = false;

    if (previewSelectionCanvas.hasPointerCapture(event.pointerId)) {
        previewSelectionCanvas.releasePointerCapture(event.pointerId);
    }

    if (
        previewSelection &&
        (
            previewSelection.width < 2 ||
            previewSelection.height < 2
        )
    ) {
        previewSelection = null;
        redrawPreviewOverlay();

        setStatus(
            "範囲が小さすぎます。もう一度、少し広めに選んでください。"
        );

        return;
    }

    if (previewSelection) {
        cutPreviewSelection();
    }
}


// 選択した文字の一部を消す処理（元の保存カードには影響しない）
function getSelectedLayerPoint(point, layer) {
    return {
        x: point.x - layer.x,
        y: point.y - layer.y
    };
}

function applyPreviewPaintSegment(layer, from, to, mode) {
    var ctx = layer.canvas.getContext("2d");
    ctx.save();
    ctx.lineWidth = PREVIEW_ERASER_SIZE;
    ctx.lineCap = "round";
    ctx.lineJoin = "round";

    if (mode === "erase") {
        ctx.globalCompositeOperation = "destination-out";
        ctx.beginPath();
        ctx.moveTo(from.x, from.y);
        ctx.lineTo(to.x, to.y);
        ctx.stroke();
    } else {
        // 「線を追加」：ブラシの形のマスクを作り、その範囲にある
        // 元カードの黒い筆跡だけを選択レイヤーへ戻す。
        // clip() は開いた線のパスでは面積がほぼゼロになるため、
        // 別キャンバスに太いストロークを描いてマスクとして使う。
        var brushMask = document.createElement("canvas");
        brushMask.width = layer.canvas.width;
        brushMask.height = layer.canvas.height;
        var maskCtx = brushMask.getContext("2d");

        maskCtx.strokeStyle = "#ffffff";
        maskCtx.lineWidth = PREVIEW_ERASER_SIZE;
        maskCtx.lineCap = "round";
        maskCtx.lineJoin = "round";
        maskCtx.beginPath();
        maskCtx.moveTo(from.x, from.y);
        maskCtx.lineTo(to.x, to.y);
        maskCtx.stroke();

        // 元カードの該当部分を切り出し、白い背景を透明にする。
        // これにより背景の白い四角ではなく、筆跡だけを追加できる。
        var sourceCanvas = document.createElement("canvas");
        sourceCanvas.width = layer.canvas.width;
        sourceCanvas.height = layer.canvas.height;
        var sourceCtx = sourceCanvas.getContext("2d");
        sourceCtx.drawImage(
            previewCanvas,
            layer.x, layer.y, layer.canvas.width, layer.canvas.height,
            0, 0, layer.canvas.width, layer.canvas.height
        );

        var sourceImage = sourceCtx.getImageData(
            0, 0, sourceCanvas.width, sourceCanvas.height
        );
        var sourceData = sourceImage.data;
        for (var i = 0; i < sourceData.length; i += 4) {
            // 選択時と同じ白背景判定を使い、白い部分は追加しない
            if (sourceData[i] > 250 && sourceData[i + 1] > 250 && sourceData[i + 2] > 250) {
                sourceData[i + 3] = 0;
            }
        }
        sourceCtx.putImageData(sourceImage, 0, 0);

        // 筆跡画像をブラシマスクの範囲に限定する
        sourceCtx.globalCompositeOperation = "destination-in";
        sourceCtx.drawImage(brushMask, 0, 0);
        sourceCtx.globalCompositeOperation = "source-over";

        ctx.globalCompositeOperation = "source-over";
        ctx.drawImage(sourceCanvas, 0, 0);
    }
    ctx.restore();
}

function expandPreviewLayerForAdd(layer) {
    // 選択範囲の外にある筆跡も追加できるよう、レイヤーをプレビュー全体の大きさに広げる。
    // 既存の切り抜き内容は元の位置に保持する。
    if (
        layer.canvas.width === previewCanvas.width &&
        layer.canvas.height === previewCanvas.height &&
        layer.x === 0 &&
        layer.y === 0
    ) {
        return;
    }

    var expandedCanvas = document.createElement("canvas");
    expandedCanvas.width = previewCanvas.width;
    expandedCanvas.height = previewCanvas.height;
    var expandedCtx = expandedCanvas.getContext("2d");
    expandedCtx.drawImage(layer.canvas, layer.x, layer.y);

    layer.canvas = expandedCanvas;
    layer.width = expandedCanvas.width;
    layer.height = expandedCanvas.height;
    layer.x = 0;
    layer.y = 0;
}

// 元のカード上でタップした筆跡とつながっている部分を、選択レイヤーへ追加する
function addConnectedStroke(layer, point) {
    var sourceCanvas = previewCanvas;
    var sourceCtx = sourceCanvas.getContext("2d");
    var width = sourceCanvas.width;
    var height = sourceCanvas.height;
    var sourceImage = sourceCtx.getImageData(0, 0, width, height);
    var sourceData = sourceImage.data;

    function isInk(index) {
        var r = sourceData[index];
        var g = sourceData[index + 1];
        var b = sourceData[index + 2];
        var a = sourceData[index + 3];
        // 白い背景を除き、アンチエイリアスを含む濃い筆跡を対象にする
        var luminance = 0.299 * r + 0.587 * g + 0.114 * b;
        return a > 10 && luminance < 245;
    }

    var startX = Math.round(point.x);
    var startY = Math.round(point.y);
    var startIndex = -1;
    var searchRadius = 9;

    // タップ位置の近くにある筆跡画素を探す
    for (var radius = 0; radius <= searchRadius && startIndex < 0; radius++) {
        for (var dy = -radius; dy <= radius && startIndex < 0; dy++) {
            for (var dx = -radius; dx <= radius; dx++) {
                if (Math.max(Math.abs(dx), Math.abs(dy)) !== radius) continue;
                var sx = startX + dx;
                var sy = startY + dy;
                if (sx < 0 || sy < 0 || sx >= width || sy >= height) continue;
                var candidate = (sy * width + sx) * 4;
                if (isInk(candidate)) {
                    startIndex = sy * width + sx;
                    break;
                }
            }
        }
    }

    if (startIndex < 0) {
        setStatus("追加したい筆跡の近くをタップしてください。");
        return false;
    }

    // 8方向につながっている筆跡を探索
    var visited = new Uint8Array(width * height);
    var queue = [startIndex];
    visited[startIndex] = 1;
    var head = 0;

    while (head < queue.length) {
        var current = queue[head++];
        var x = current % width;
        var y = Math.floor(current / width);

        for (var oy = -1; oy <= 1; oy++) {
            for (var ox = -1; ox <= 1; ox++) {
                if (ox === 0 && oy === 0) continue;
                var nx = x + ox;
                var ny = y + oy;
                if (nx < 0 || ny < 0 || nx >= width || ny >= height) continue;
                var next = ny * width + nx;
                if (visited[next]) continue;
                if (isInk(next * 4)) {
                    visited[next] = 1;
                    queue.push(next);
                }
            }
        }
    }

    // 元カードの画素をそのまま選択レイヤーへ追加する
    var targetCtx = layer.canvas.getContext("2d");
    var targetImage = targetCtx.getImageData(0, 0, width, height);
    var targetData = targetImage.data;
    for (var i = 0; i < queue.length; i++) {
        var pixel = queue[i] * 4;
        targetData[pixel] = sourceData[pixel];
        targetData[pixel + 1] = sourceData[pixel + 1];
        targetData[pixel + 2] = sourceData[pixel + 2];
        targetData[pixel + 3] = sourceData[pixel + 3];
    }
    targetCtx.putImageData(targetImage, 0, 0);
    setStatus("タップした筆跡のつながった部分を追加しました。");
    return true;
}

// タップした筆跡とつながっている部分を、ひとかたまりとして消す
function eraseConnectedStroke(layer, point) {
    var canvas = layer.canvas;
    var ctx = canvas.getContext("2d");
    var width = canvas.width;
    var height = canvas.height;
    var image = ctx.getImageData(0, 0, width, height);
    var data = image.data;

    var startX = Math.round(point.x);
    var startY = Math.round(point.y);
    var startIndex = -1;

    // 赤い輪郭の上をタップした場合も拾えるよう、近傍から筆跡画素を探す
    var searchRadius = 7;
    for (var radius = 0; radius <= searchRadius && startIndex < 0; radius++) {
        for (var dy = -radius; dy <= radius && startIndex < 0; dy++) {
            for (var dx = -radius; dx <= radius; dx++) {
                if (Math.max(Math.abs(dx), Math.abs(dy)) !== radius) continue;
                var sx = startX + dx;
                var sy = startY + dy;
                if (sx < 0 || sy < 0 || sx >= width || sy >= height) continue;
                var candidate = (sy * width + sx) * 4;
                if (data[candidate + 3] > 20) {
                    startIndex = sy * width + sx;
                    break;
                }
            }
        }
    }

    if (startIndex < 0) {
        setStatus("筆跡の赤枠付近をタップしてください。");
        return false;
    }

    // 8方向でつながっている画素を探索し、その領域だけ透明にする
    var visited = new Uint8Array(width * height);
    var queue = [startIndex];
    visited[startIndex] = 1;
    var head = 0;

    while (head < queue.length) {
        var current = queue[head++];
        var x = current % width;
        var y = Math.floor(current / width);
        var pixel = current * 4;
        data[pixel + 3] = 0;

        for (var oy = -1; oy <= 1; oy++) {
            for (var ox = -1; ox <= 1; ox++) {
                if (ox === 0 && oy === 0) continue;
                var nx = x + ox;
                var ny = y + oy;
                if (nx < 0 || ny < 0 || nx >= width || ny >= height) continue;
                var next = ny * width + nx;
                if (visited[next]) continue;
                if (data[next * 4 + 3] > 20) {
                    visited[next] = 1;
                    queue.push(next);
                }
            }
        }
    }

    ctx.putImageData(image, 0, 0);
    setStatus("タップした筆跡のつながった部分を消しました。");
    return true;
}

function beginPreviewPaint(event, mode) {
    var layer = previewLayers[previewSelectedLayerIndex];
    if (!layer) {
        setStatus("先に範囲選択をしてください。");
        return;
    }

    if (mode === "add") {
        expandPreviewLayerForAdd(layer);
    }

    var point = getCanvasPoint(event, previewSelectionCanvas);
    var localPoint = getSelectedLayerPoint(point, layer);
    localPoint.x = Math.max(0, Math.min(layer.canvas.width, localPoint.x));
    localPoint.y = Math.max(0, Math.min(layer.canvas.height, localPoint.y));

    previewErasing = true;
    previewPaintMode = mode;
    previewEraseLastPoint = localPoint;
    previewPaintStartPoint = {x: localPoint.x, y: localPoint.y};
    previewPaintMoved = false;
    previewSelectionCanvas.setPointerCapture(event.pointerId);
    event.preventDefault();
}
function continuePreviewPaint(event) {
    if (!previewErasing) return;
    var layer = previewLayers[previewSelectedLayerIndex];
    if (!layer) return;

    var point = getCanvasPoint(event, previewSelectionCanvas);
    var localPoint = getSelectedLayerPoint(point, layer);
    localPoint.x = Math.max(0, Math.min(layer.canvas.width, localPoint.x));
    localPoint.y = Math.max(0, Math.min(layer.canvas.height, localPoint.y));

    if ((previewPaintMode === "erase" || previewPaintMode === "add") && !previewPaintMoved) {
        var dx = localPoint.x - previewPaintStartPoint.x;
        var dy = localPoint.y - previewPaintStartPoint.y;
        if (Math.sqrt(dx * dx + dy * dy) < 4) {
            event.preventDefault();
            return;
        }

        previewPaintMoved = true;
        if (previewPaintMode === "erase") {
            applyPreviewPaintSegment(
                layer,
                previewPaintStartPoint,
                previewPaintStartPoint,
                "erase"
            );
        }
    }

    if (previewPaintMode === "erase" || previewPaintMode === "add") {
        applyPreviewPaintSegment(
            layer, previewEraseLastPoint, localPoint, previewPaintMode
        );
    }

    previewEraseLastPoint = localPoint;
    redrawPreviewOverlay();
    event.preventDefault();
}
function stopPreviewErase(event) {
    if (!previewErasing) return;

    // 動かさずに離した場合は、タップした筆跡の連結領域をまとめて処理
    if (!previewPaintMoved && previewPaintStartPoint) {
        var layer = previewLayers[previewSelectedLayerIndex];
        if (layer) {
            if (previewPaintMode === "erase") {
                eraseConnectedStroke(layer, previewPaintStartPoint);
            } else if (previewPaintMode === "add") {
                addConnectedStroke(layer, previewPaintStartPoint);
            }
        }
    }

    previewErasing = false;
    previewEraseLastPoint = null;
    previewPaintStartPoint = null;
    previewPaintMoved = false;
    previewPaintMode = null;
    if (previewSelectionCanvas.hasPointerCapture(event.pointerId)) {
        previewSelectionCanvas.releasePointerCapture(event.pointerId);
    }
    redrawPreviewOverlay();
}
// 範囲選択・部分消去用キャンバスのイベント
previewSelectionCanvas.addEventListener("pointerdown", function (event) {
    if (messageMode) return;

    if (previewMode !== "select" && previewMode !== "erase" && previewMode !== "add") return;

    event.preventDefault();

    if (previewMode === "select") {
        beginPreviewSelection(event);
    } else if (previewMode === "erase") {
        setStatus("消したい線をタッチ、またはなぞってください。");
        beginPreviewPaint(event, "erase");
    } else if (previewMode === "add") {
        setStatus("追加したい線をタップ、またはなぞってください。");
        beginPreviewPaint(event, "add");
    }
});

previewSelectionCanvas.addEventListener("pointermove", function (event) {
    if (previewSelecting) {
        event.preventDefault();
        continuePreviewSelection(event);
    } else if (previewErasing) {
        event.preventDefault();
        continuePreviewPaint(event);
    }
});

previewSelectionCanvas.addEventListener("pointerup", function (event) {
    if (previewSelecting) {
        stopPreviewSelection(event);
    } else if (previewErasing) {
        stopPreviewErase(event);
    }
});

previewSelectionCanvas.addEventListener("pointercancel", function (event) {

function renderHandwritingKeyboard() {
    keyboardGrid.innerHTML = "";

    var keyboardRows = [
        ["っ","ゃ","ぱ","ば","だ","ざ","が","わ","ら","や","ま","は","な","た","さ","か","あ"],
        ["","","ぴ","び","ぢ","じ","ぎ","","り","","み","ひ","に","ち","し","き","い"],

    keyboardRows.forEach(function (row) {

                var image = document.createElement("img");
                image.src = glyph.dataUrl;

confirmRegisterButton.addEventListener("click", function () {
    if (!registerTargetLayer) {
        return;
    }

    // 登録時は透明部分を除いた筆跡の範囲だけを切り出す。
    // 「線を追加」のためにレイヤーをプレビュー全体へ広げていても、
    // キーボード上で文字が極端に小さく表示されないようにする。
    var sourceCanvas = registerTargetLayer.canvas;
    var sourceCtx = sourceCanvas.getContext("2d");
    var sourceImage = sourceCtx.getImageData(
        0, 0, sourceCanvas.width, sourceCanvas.height
    );
    var pixels = sourceImage.data;

    var minX = sourceCanvas.width;
    var minY = sourceCanvas.height;
    var maxX = -1;
    var maxY = -1;

    for (var y = 0; y < sourceCanvas.height; y += 1) {
        for (var x = 0; x < sourceCanvas.width; x += 1) {
            var alpha = pixels[(y * sourceCanvas.width + x) * 4 + 3];
            if (alpha > 10) {
                if (x < minX) minX = x;
                if (y < minY) minY = y;
                if (x > maxX) maxX = x;
                if (y > maxY) maxY = y;
            }
        }
    }

    if (maxX < minX || maxY < minY) {
        setStatus("登録できる線がありません。線を追加するか、範囲を選び直してください。");
        return;
    }

    // 少しだけ余白を付けて切り出す
    var margin = 3;
    minX = Math.max(0, minX - margin);
    minY = Math.max(0, minY - margin);
    maxX = Math.min(sourceCanvas.width - 1, maxX + margin);
    maxY = Math.min(sourceCanvas.height - 1, maxY + margin);

    var copyCanvas = document.createElement("canvas");
    copyCanvas.width = maxX - minX + 1;
    copyCanvas.height = maxY - minY + 1;

    copyCanvas.getContext("2d").drawImage(
        sourceCanvas,
        minX, minY, copyCanvas.width, copyCanvas.height,
        0, 0, copyCanvas.width, copyCanvas.height
    );

    var kana = registerKana.value;

    if (!registeredGlyphs[kana]) {
        registeredGlyphs[kana] = [];
    }

    registeredGlyphs[kana].push({
        dataUrl: copyCanvas.toDataURL("image/png"),
        savedAt: Date.now()
    });

    if (saveRegisteredGlyphs()) {
        renderHandwritingKeyboard();
        setStatus("「" + kana + "」をキーボードに登録しました。");
    }

    registerDialog.classList.remove("visible");
    registerTargetLayer = null;
});

// 選択したカードのメッセージを復元
function restoreMessage(snapshot) {
    messageCtx.clearRect(
        0,
        0,
        messageCanvas.width,
        messageCanvas.height
    );

    messageHasContent = false;

    if (!snapshot.messageDataUrl) {
        return;
    }

    var image = new Image();

    image.onload = function () {
        // 読み込み中に別のカードへ切り替わっていたら描画しない
        if (currentSnapshot !== snapshot) {
            return;
        }

        messageCtx.clearRect(
            0,
            0,
            messageCanvas.width,
            messageCanvas.height
        );

        messageCtx.drawImage(
            image,
            0,
            0,
            messageCanvas.width,
            messageCanvas.height
        );

        messageHasContent = true;
    };

    image.src = snapshot.messageDataUrl;
}

        messageMode = false;

        messageCanvas.style.pointerEvents = "none";

                );
            }

            console.log("グループ作成成功:", group);
            await loadMyGroups();
            // 作成完了のお知らせ
            showGroupNotice(
                "グループを作成しました！",
                `
                    <p>グループ名</p>
                    <div class="group-notice-code" id="createdGroupName"></div>

                    <p>招待コード（参加する人に共有してください）</p>
                    <div class="group-notice-code" id="createdInviteCode"></div>
                `
            );

            document.getElementById("createdGroupName").textContent =
                group.group_name;

            document.getElementById("createdInviteCode").textContent =
                group.invite_code;

        } catch (error) {

            console.error("グループ作成エラー:", error);

            showFeatureNotice(
                "グループを作成できませんでした。\n" +
                (error.message || "原因不明のエラーです。")
            );

        } finally {

            createGroupButton.disabled = false;

        }
    });


    // ==============================
    // 招待コードでグループ参加
    // ==============================

    joinGroupButton.addEventListener("click", async function () {

        closeMenu();

        const inputCode = window.prompt(
            "招待コードを入力してください。"
        );

        if (inputCode === null) {
            return;
        }

        const inviteCode = inputCode.trim().toUpperCase();

        if (!inviteCode) {
            showFeatureNotice("招待コードを入力してください。");
            return;
        }

        joinGroupButton.disabled = true;

        try {

            // 招待コードを使ってSupabaseの関数を実行
            const { data, error } = await supabaseClient
                .rpc("join_group_by_invite_code", {
                    _invite_code: inviteCode
                });

            if (error) {
                throw error;
            }

            // 該当するグループがなかった場合
            if (!data || data.length === 0) {
                showFeatureNotice(
                    "招待コードに一致するグループが見つかりませんでした。コードを確認してください。"
                );
                return;
            }

            // 参加したグループ名
            const group = data[0];

            console.log("グループ参加成功:", group);
            await loadMyGroups();
            // 参加完了のお知らせ
            showGroupNotice(
                "グループに参加しました！",
                `
                    <p>参加したグループ</p>
                    <div class="group-notice-code"></div>
                `
            );

            groupNoticeBody.querySelector(
                ".group-notice-code"
            ).textContent = group.group_name;

        } catch (error) {

            console.error("グループ参加エラー:", error);

            showFeatureNotice(
                "グループに参加できませんでした。\n" +
                (error.message || "原因不明のエラーです。")
            );

        } finally {

            joinGroupButton.disabled = false;

        }
    });


    // ==============================
    // ログアウト
    // ==============================

    logoutButton.addEventListener("click", async function () {

        logoutButton.disabled = true;
        logoutButton.textContent = "ログアウト中...";

        try {

            const { error } = await supabaseClient.auth.signOut();

            if (error) {
                throw error;
            }

            location.replace("index.html");

        } catch (error) {

            console.error("ログアウトエラー:", error);

            logoutButton.disabled = false;
            logoutButton.textContent = "ログアウト";

            showFeatureNotice(
                "ログアウトできませんでした。もう一度お試しください。"
            );

        }
    });


    // ==============================
    // 初期ログイン確認
    // ==============================

    // ==============================
    // グループ一覧・切り替え
    // ==============================

    const accountGroupList =
        document.getElementById("accountGroupList");

    let myGroups = [];

    window.currentGroupId = null;
    window.currentGroupName = "";

    // ユーザーごとに選択中のグループを記憶
    function getGroupStorageKey() {
        return "selectedGroupId_" + window.currentUserId;
    }

    // グループを切り替える
    function selectGroup(groupId) {

        const group = myGroups.find(
            item => item.id === groupId
        );

        if (!group) {
            return;
        }

        window.currentGroupId = group.id;
        window.currentGroupName = group.name;

        localStorage.setItem(
            getGroupStorageKey(),
            group.id
        );

        renderGroupList();
        loadSnapshotsFromSupabase();

        console.log(
            "選択中のグループ:",
            window.currentGroupName,
            window.currentGroupId
        );
    }

    // グループ一覧を表示する
    function renderGroupList() {

        accountGroupList.replaceChildren();

        if (myGroups.length === 0) {

            const empty = document.createElement("div");

            empty.className = "account-group-empty";
            empty.textContent = "参加中のグループがありません";

            accountGroupList.appendChild(empty);

            return;
        }

        myGroups.forEach(group => {

            const button = document.createElement("button");

            button.type = "button";
            button.className = "account-group-button";

            const name = document.createElement("span");

            name.textContent = group.name;

            button.appendChild(name);

            const isActive =
                group.id === window.currentGroupId;

            button.setAttribute(
                "aria-pressed",
                String(isActive)
            );

            // 選択中のグループ
            if (isActive) {

                button.classList.add("active");

                const check = document.createElement("span");

                check.className = "account-group-check";
                check.textContent = "✓";

                button.appendChild(check);
            }

            // グループ名を押したとき
            button.addEventListener("click", function () {

                selectGroup(group.id);

            });

            accountGroupList.appendChild(button);

        });
    }

    // Supabaseから参加中のグループを取得
    async function loadMyGroups() {

        try {

            const { data, error } = await supabaseClient
                .from("groups")
                .select("id, name")
                .order("name");

            if (error) {
                throw error;
            }

            myGroups = data || [];

            const savedGroupId = localStorage.getItem(
                getGroupStorageKey()
            );

            const savedGroup = myGroups.find(
                group => group.id === savedGroupId
            );

            if (savedGroup) {

                selectGroup(savedGroup.id);

            } else if (myGroups.length > 0) {

                selectGroup(myGroups[0].id);

            } else {

                window.currentGroupId = null;
                window.currentGroupName = "";
                loadSnapshotsFromSupabase();


                localStorage.removeItem(
                    getGroupStorageKey()
                );

                renderGroupList();
                loadSnapshotsFromSupabase();
            }

        } catch (error) {

            console.error("グループ取得エラー:", error);

            myGroups = [];

            window.currentGroupId = null;
            window.currentGroupName = "";

            const empty = document.createElement("div");

            empty.className = "account-group-empty";
            empty.textContent = "グループを取得できませんでした";

            accountGroupList.replaceChildren(empty);

        }
    }
    async function initializeAuth() {

        try {

            const { data, error } =
                await supabaseClient.auth.getSession();

            if (error) {
                throw error;
            }

            if (!data.session) {
                location.replace("index.html");
                return;
            }

            const user = data.session.user;

            const nickname =
                user.user_metadata?.nickname || "ユーザー";

            // 他のJavaScriptからも利用できるように保存
            window.currentUserId = user.id;
            window.currentUserNickname = nickname;

            accountMenuUser.textContent =
                nickname + " さんでログイン中";

            // ログイン中のニックネームを反映して保存カード一覧を再描画
            renderSnapshotList();

            console.log("ログインユーザーID:", user.id);
            await loadMyGroups();
            document.body.classList.remove("auth-pending");

        } catch (error) {

            console.error(
                "ログイン状態の確認に失敗しました:",
                error
            );

            location.replace("index.html");

        }
    }

    initializeAuth();

})();
</script>


</body>

</html>


<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>メッセージと文字を交換するサイト</title>

<style>
:root {
    color-scheme: light;
    --bg: #e5e5e5;
    --panel: #ffffff;
    --ink: #1d1d1f;
    --muted: #6b7280;
    --line: #d6d3cc;
    --accent: #626262;
    --accent-soft: #fbfbfb;
}

body {
    margin: 0;
    font-family: "ヒラギノ丸ゴ Pro", serif;
    color: var(--ink);
    background: #F2F1F1;
}

main {
    max-width: 1180px;
    margin: 0 auto;
    padding: 24px 16px 40px;
}

header {
    margin-bottom: 18px;
}

header h1 {
    margin: 0;
    font-size: clamp(1.8rem, 3vw, 2.6rem);
    letter-spacing: 0.04em;
}

.status {
    width: min(100%, 960px);
    margin: 8px auto 16px;
    color: var(--muted);
    text-align: center;
    font-size: 0.95rem;
}

.gallery {
    margin-top: 10px;
    padding: 18px;
}

button {
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 11px 18px;
    font-size: 1rem;
    line-height: 1;
    color: var(--ink);
    background: #ebebeb;
    cursor: pointer;
    transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
}

button:hover {
    transform: translateY(-1px);
    box-shadow: 0 8px 18px rgba(15, 23, 42, 0.08);
}

button:active {
    color: var(--accent-soft);
    background: var(--accent);
    border-color: var(--accent-soft);
}

button.active {
    color: var(--accent-soft);
    background: var(--accent);
    border-color: var(--accent-soft);
}

.snapshot-list {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 14px;
}

.snapshot-item {
    border: 1px solid var(--line);
    border-radius: 16px;
    background: rgba(255, 255, 255, 0.92);
    padding: 12px;
}

.snapshot-meta {
    display: flex;
    justify-content: space-between;
    gap: 8px;
    align-items: center;
    margin-bottom: 10px;
    font-size: 0.92rem;
}

.snapshot-title {
    font-weight: 700;
}

.snapshot-preview {
    display: grid;
    place-items: center;
    min-height: 160px;
    border: 1px solid #e5e7eb;
    border-radius: 14px;
    background: #fbfbfb;
    overflow: hidden;
}

.snapshot-preview img {
    display: block;
    max-width: 100%;
    max-height: 240px;
    object-fit: contain;
}

.empty {
    color: var(--muted);
    text-align: center;
    padding: 28px 0;
}

.preview-panel {
    display: none;
    margin-top: 18px;
    padding: 18px;
    border-radius: 16px;
    background: rgba(255, 255, 255, 0.7);
}

.preview-panel h2 {
    margin: 0 0 12px;
}

/* 左の操作ボタンと右のキャンバスを横並びにする */
.preview-layout {
    display: flex;
    align-items: center;
    gap: 32px;
    width: 100%;
    margin: 0 auto;
}

/* 左側の操作ボタン */
.preview-tools {
    flex: 0 0 120px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
}

.preview-tools button {
    width: 100px;
    height: 80px;
    padding: 14px 8px;
}

/* 右側のキャンバス領域 */
.preview-shell {
    position: relative;
    flex: 1;
    min-width: 0;
    width: auto;
    margin: 0;
    aspect-ratio: 11 / 7;
    border: 1px solid var(--line);
    border-radius: 18px;
    overflow: hidden;
}

/* キャンバスの見出し */
.preview-title {
    position: absolute;
    top: 4%;
    left: 0;
    width: 100%;
    margin: 0;
    text-align: center;
    font-size: clamp(1.4rem, 3vw, 2.6rem);
    z-index: 4;
}

/* 中央のカード領域 */
.card-area {
    position: absolute;
    left: 9.09%;
    top: 23%;
    width: 81.82%;
    height: 65%;
    background: trasparent;
}

/* カード本体と範囲選択用キャンバス */
.card-area canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    touch-action: none;
}

/* メッセージ用キャンバス */
#messageCanvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    touch-action: none;
    pointer-events: none;
    z-index: 3;
}

/* 右上のボタン2つ */
.preview-corner-buttons {
    position: absolute;
    top: 12px;
    right: 12px;
    z-index: 5;
    display: flex;
    align-items: center;
    gap: 8px;
}

/* メッセージ表示切り替えボタン */
.preview-corner-buttons button {
    padding: 9px 14px;
    font-size: 0.9rem;
}

/* ×ボタン */
.preview-corner-buttons .close-preview {
    width: 38px;
    height: 38px;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 26px;
    border-radius: 50%;
}

/* カード本体と範囲選択用キャンバス */
.card-area canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    touch-action: none;
}

/* メッセージ用キャンバス */
#messageCanvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    touch-action: none;
    pointer-events: none;
    z-index: 3;
}

.preview-controls {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px;
    margin-top: 14px;
}

.keyboard-tools {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px;
    margin: 0 0 14px;
}

#keyboardPanel {
    display: none;
    position: relative;
    z-index: 6;
    margin: 14px 0 24px;
    padding: 16px;
    border: 1px solid var(--line);
    border-radius: 14px;
    background: #fff;
    overflow-x: auto;
}

#keyboardPanel.visible {
    display: block;
}

.keyboard-grid {
    display: grid;
    grid-template-columns: repeat(17, minmax(0, 1fr));
    gap: 4px;
    min-width: 720px;
}

.keyboard-key {
    min-width: 0;
    min-height: 42px;
    padding: 3px 1px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    border: 1px solid #ccc;
    border-radius: 3px;
    background: #e5e5e5;
    color: #222;
}

.keyboard-key .key-label {
    font-size: 16px;
}

.keyboard-key img {
    width: 28px;
    height: 28px;
    object-fit: contain;
}

.keyboard-key.registered {
    background: #fff;
    border-color: #6b7280;
}

.keyboard-key:disabled {
    opacity: 0.5;
    background: #f3f4f6;
    cursor: not-allowed;
}

#registerDialog {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 1000;
    background: #0008;
    align-items: center;
    justify-content: center;
    padding: 16px;
}

#registerDialog.visible {
    display: flex;
}

.register-box {
    width: min(420px, 100%);
    background: #fff;
    border-radius: 14px;
    padding: 22px;
    box-shadow: 0 10px 40px #0003;
}

.register-box select {
    width: 100%;
    padding: 12px;
    margin: 12px 0;
    font-size: 18px;
}

.register-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: flex-end;
}

.site-header {
    position: sticky;
    top: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 24px;
    width: 100%;
    box-sizing: border-box;
    padding: 12px max(16px, calc((100vw - 1180px) / 2 + 16px));
    background: var(--bg);
    border-bottom: 1px solid rgba(214, 211, 204, 0.85);
}

.site-header header {
    min-width: 0;
    margin: 0;
}

.site-header h1 {
    font-size: clamp(1.25rem, 2.3vw, 2rem);
}

.site-nav {
    flex: 0 0 auto;
    width: 400px;
    margin: 0;
    padding: 6px;
    display: flex;
    gap: 8px;
    border: 1px solid #dedede;
    border-radius: 16px;
    background: #f7f7f7;
    box-sizing: border-box;
}

.site-nav a {
    flex: 1;
    min-width: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 13px 10px;
    border-radius: 11px;
    text-decoration: none;
    color: #333;
    font-size: 15px;
    font-weight: 600;
    text-align: center;
    transition: background 0.15s ease, color 0.15s ease;
}

.site-nav a.active {
    background: #414141;
    color: var(--accent-soft);
}

.site-nav .nav-icon {
    font-size: 18px;
    line-height: 1;
}

@media (max-width: 600px) {
    .keyboard-grid {
        grid-template-columns: repeat(18, minmax(0, 1fr));
    }
}

@media (max-width: 760px) {
    .site-header {
        gap: 12px;
        padding: 10px 12px;
    }

    .site-header h1 {
        font-size: clamp(1.05rem, 3.5vw, 1.5rem);
    }

    .site-nav {
        padding: 5px;
        gap: 5px;
    }

    .site-nav a {
        padding: 10px 8px;
        gap: 5px;
        font-size: 13px;
    }

    .site-nav .nav-icon {
        display: none;
    }
}

@media (max-width: 520px) {
    .site-header {
        align-items: flex-start;
        flex-direction: column;
        gap: 8px;
    }

    .site-nav {
        width: 100%;
    }

    .site-nav a {
        flex: 1;
    }
}

* {
  font-family: "ヒラギノ丸ゴ Pro", serif !important;
}

</style>
</head>

<body>
<div class="site-header">
    <header>
        <h1>メッセージと文字を交換するサイト</h1>
    </header>

    <!-- ナビゲーションバー -->
    <nav class="site-nav" aria-label="メインナビゲーション">
        <a href="write.html">
            <span class="nav-icon">✎</span>
            <span>メッセージを書く</span>
        </a>
        <a href="keybord.html" class="active">
            <span class="nav-icon">▤</span>
            <span>みんなのメッセージ</span>
        </a>
    </nav>
</div>

<main>
    <div id="status" class="status">
        カードを選ぶと、メッセージを書いたり範囲選択してキーボードへ登録したりできます。
    </div>

    
    <section id="previewPanel" class="preview-panel">
        <h2>選択したカード</h2>

        <div class="preview-layout">

            <!-- 左側の操作ボタン -->
            <div class="preview-tools">
                <button id="previewSelect">範囲選択</button>
                <button type="button" id="registerKeyboard">キーボードに登録</button>
                <button type="button" id="toggleKeyboard">キーボードを表示</button>
                <button type="button" id="toggleMessage">メッセージを書く</button>
            </div>

            <!-- キャンバス部分 -->
            <div class="preview-shell">

                <div class="card-area">
                    <canvas id="previewCanvas" width="900" height="540"></canvas>
                    <canvas id="previewSelectionCanvas" width="900" height="540"></canvas>
                </div>

                <canvas id="messageCanvas" width="1100" height="700"></canvas>

                <!-- 右上の操作ボタン -->
                <div class="preview-corner-buttons">
                    <button type="button" id="toggleMessageVisibility">
                        メッセージを非表示
                    </button>

                    <button type="button" id="previewClear"
                            class="close-preview" aria-label="プレビューを閉じる">
                        ×
                    </button>
                </div>

            </div>
        </div>
    </section>


    <section id="keyboardPanel" aria-label="手書き文字キーボード">
        <div id="keyboardGrid" class="keyboard-grid"></div>
    </section>

    <div id="registerDialog" role="dialog" aria-modal="true" aria-labelledby="registerTitle">
        <div class="register-box">
            <h2 id="registerTitle">登録する文字を選択</h2>
            <p>選択した文字を、どのひらがなとして登録するか選んでください。</p>
            <select id="registerKana" aria-label="登録するひらがな"></select>
            <div class="register-actions">
                <button type="button" id="cancelRegister">キャンセル</button>
                <button type="button" id="confirmRegister">登録する</button>
            </div>
        </div>
    </div>

    <section class="gallery">
    <div class="gallery-header">
        <h2>保存したカード</h2>
        <button type="button" id="resetAllButton" class="destructive">
            すべてリセット
        </button>
    </div>

    <div id="snapshotList" class="snapshot-list">
        <div id="snapshotEmpty" class="empty">
            まだ保存されていません。
        </div>
    </div>
</section>
</main>

<script>
var SAVED_CARD_STORAGE_KEY = "sharedSavedCards_v1";
var GLYPH_STORAGE_KEY = "handwritingKeyboardGlyphs_v1";

var status = document.getElementById("status");
var snapshotList = document.getElementById("snapshotList");
var snapshotEmpty = document.getElementById("snapshotEmpty");
var previewPanel = document.getElementById("previewPanel");

var previewCanvas = document.getElementById("previewCanvas");
var previewSelectionCanvas = document.getElementById("previewSelectionCanvas");
var previewCtx = previewCanvas.getContext("2d");
var previewSelectionCtx = previewSelectionCanvas.getContext("2d");

var messageCanvas = document.getElementById("messageCanvas");
var messageCtx = messageCanvas.getContext("2d");

var toggleMessageButton = document.getElementById("toggleMessage");
// モード切り替えボタンの青色表示を管理
function setPreviewActiveButton(activeButton) {
    [previewSelectButton, toggleMessageButton].forEach(function (button) {
        button.classList.toggle("active", button === activeButton);
    });
}
var toggleMessageVisibilityButton =
    document.getElementById("toggleMessageVisibility");

var messageVisible = true;
var messageDrawing = false;
var messageHasContent = false;
var messageMode = false;

var previewSelectButton = document.getElementById("previewSelect");
var previewClearButton = document.getElementById("previewClear");
var registerKeyboardButton = document.getElementById("registerKeyboard");
var toggleKeyboardButton = document.getElementById("toggleKeyboard");

var keyboardPanel = document.getElementById("keyboardPanel");
var keyboardGrid = document.getElementById("keyboardGrid");

var registerDialog = document.getElementById("registerDialog");
var registerKana = document.getElementById("registerKana");
var confirmRegisterButton = document.getElementById("confirmRegister");
var cancelRegisterButton = document.getElementById("cancelRegister");

var snapshots = [];
var previewImage = null;
var currentSnapshot = null; // 現在表示しているカード
var previewLayers = [];
var previewSelectedLayerIndex = -1;
var previewSelecting = false;
var previewSelection = null;
var previewSelectionStart = null;
var previewMode = "idle";

var kanaKeys = [
    "あ", "い", "う", "え", "お",
    "か", "き", "く", "け", "こ",
    "さ", "し", "す", "せ", "そ",
    "た", "ち", "つ", "て", "と",
    "な", "に", "ぬ", "ね", "の",
    "は", "ひ", "ふ", "へ", "ほ",
    "ま", "み", "む", "め", "も",
    "や", "ゆ", "よ",
    "ら", "り", "る", "れ", "ろ",
    "わ", "を", "ん",
    "が", "ぎ", "ぐ", "げ", "ご",
    "ざ", "じ", "ず", "ぜ", "ぞ",
    "だ", "ぢ", "づ", "で", "ど",
    "ば", "び", "ぶ", "べ", "ぼ",
    "ぱ", "ぴ", "ぷ", "ぺ", "ぽ"
];

var registeredGlyphs = {};
var registerTargetLayer = null;


// ------------------------------
// 共通処理
// ------------------------------

function setStatus(message) {
    status.textContent = message;
}

function getCanvasPoint(event, targetCanvas) {
    var rect = targetCanvas.getBoundingClientRect();

    var scaleX = targetCanvas.width / rect.width;
    var scaleY = targetCanvas.height / rect.height;

    return {
        x: (event.clientX - rect.left) * scaleX,
        y: (event.clientY - rect.top) * scaleY
    };
}

function normalizeRect(start, end) {
    return {
        x: Math.min(start.x, end.x),
        y: Math.min(start.y, end.y),
        width: Math.abs(end.x - start.x),
        height: Math.abs(end.y - start.y)
    };
}


// ------------------------------
// 保存カードの読み込み・表示
// ------------------------------

function loadSnapshotsFromStorage() {
    try {
        var raw = localStorage.getItem(SAVED_CARD_STORAGE_KEY);
        var parsed = raw ? JSON.parse(raw) : [];

        if (!Array.isArray(parsed)) {
            snapshots = [];
            return;
        }

        snapshots = parsed.filter(function (item) {
            return item && typeof item.dataUrl === "string";
        }).map(function (item) {
            return {
                dataUrl: item.dataUrl,
                width: typeof item.width === "number" ? item.width : 900,
                height: typeof item.height === "number" ? item.height : 540,
                messageDataUrl:
                    typeof item.messageDataUrl === "string"
                        ? item.messageDataUrl
                        : ""
            };
        });

    } catch (error) {
        snapshots = [];
    }
}

function updateSnapshotEmptyState() {
    snapshotEmpty.style.display =
        snapshots.length === 0 ? "grid" : "none";
}

function renderSnapshotList() {
    snapshotList.innerHTML = "";

    if (snapshots.length === 0) {
        snapshotList.appendChild(snapshotEmpty);
        updateSnapshotEmptyState();
        return;
    }

    snapshots.forEach(function (snapshot, index) {
        var item = document.createElement("article");
        item.className = "snapshot-item";
        item.title = "クリックして選択カードを表示";
        item.style.cursor = "pointer";

        var meta = document.createElement("div");
        meta.className = "snapshot-meta";

        var title = document.createElement("div");
        title.className = "snapshot-title";
        title.textContent = "カード " + (index + 1);

        meta.appendChild(title);

        var preview = document.createElement("div");
        preview.className = "snapshot-preview";

        var img = document.createElement("img");
        img.src = snapshot.dataUrl;
        img.alt = "保存したカード " + (index + 1);

        preview.appendChild(img);
        item.appendChild(meta);
        item.appendChild(preview);

        item.addEventListener("click", function () {
            showSnapshotPreview(snapshot);
        });

        snapshotList.appendChild(item);
    });
}


// ------------------------------
// プレビュー・範囲選択
// ------------------------------

function clearPreviewOverlay() {
    previewSelectionCtx.clearRect(
        0,
        0,
        previewSelectionCanvas.width,
        previewSelectionCanvas.height
    );
}

function drawPreviewLayer(layer) {
    previewSelectionCtx.drawImage(
        layer.canvas,
        layer.x,
        layer.y
    );
}

function redrawPreviewOverlay() {
    clearPreviewOverlay();

    for (var index = 0; index < previewLayers.length; index += 1) {
        drawPreviewLayer(previewLayers[index]);
    }

    if (previewMode === "select" && previewSelection) {
        previewSelectionCtx.save();

        previewSelectionCtx.strokeStyle = "rgba(37, 99, 235, 0.95)";
        previewSelectionCtx.fillStyle = "rgba(37, 99, 235, 0.10)";
        previewSelectionCtx.lineWidth = 2;
        previewSelectionCtx.setLineDash([8, 6]);

        previewSelectionCtx.fillRect(
            previewSelection.x,
            previewSelection.y,
            previewSelection.width,
            previewSelection.height
        );

        previewSelectionCtx.strokeRect(
            previewSelection.x,
            previewSelection.y,
            previewSelection.width,
            previewSelection.height
        );

        previewSelectionCtx.restore();
    }
}
function showSnapshotPreview(snapshot) {

    // 前のカードのメッセージ入力を終了して保存
    if (currentSnapshot && currentSnapshot !== snapshot) {
        finishMessageMode();
    }

    // 表示するカードを切り替える
    currentSnapshot = snapshot;

    previewPanel.style.display = "block";

    var image = new Image();

    image.onload = function () {
        previewImage = image;

       // 外側のキャンバスを透明にする
        previewCtx.clearRect(0, 0, previewCanvas.width, previewCanvas.height);

        // 内側のカードの表示範囲
        var marginX = 90;
        var marginY = 65;

        var innerWidth = previewCanvas.width - marginX * 2;
        var innerHeight = previewCanvas.height - marginY * 2;

        // カードの縦横比を維持して表示
        var scale = Math.min(
            innerWidth / image.naturalWidth,
            innerHeight / image.naturalHeight
        );

        var drawWidth = image.naturalWidth * scale;
        var drawHeight = image.naturalHeight * scale;

        var drawX = (previewCanvas.width - drawWidth) / 2;
        var drawY = (previewCanvas.height - drawHeight) / 2;

        // 内側のカードを描画
        previewCtx.drawImage(
            image,
            drawX,
            drawY,
            drawWidth,
            drawHeight
        );

        // カードの境界線
        previewCtx.strokeStyle = "#d6d3cc";
        previewCtx.lineWidth = 2;
        previewCtx.strokeRect(
            drawX,
            drawY,
            drawWidth,
            drawHeight
        );

        // 範囲選択関連の初期化
        // 範囲選択関連の初期化
        previewLayers = [];
        previewSelectedLayerIndex = -1;
        previewSelecting = false;
        previewSelection = null;
        previewSelectionStart = null;

        // 初期状態はどちらの操作も無効
        previewMode = "idle";
        messageMode = false;
        setPreviewActiveButton(null);

        messageCanvas.style.pointerEvents = "none";
        previewSelectionCanvas.style.pointerEvents = "none";

        // メッセージを書くボタンの表示を戻す
        toggleMessageButton.textContent = "メッセージを書く";

        // 選択したカードのメッセージを復元
        restoreMessage(snapshot);

        redrawPreviewOverlay();

        setStatus("保存カードを表示しました。範囲選択してキーボードに登録できます。");
    };

    image.src = snapshot.dataUrl;
}

function resetPreview() {
    previewCtx.clearRect(0, 0, previewCanvas.width, previewCanvas.height);
    previewCtx.fillStyle = "#ffffff";
    previewCtx.fillRect(0, 0, previewCanvas.width, previewCanvas.height);

    previewSelectionCtx.clearRect(
        0, 0,
        previewSelectionCanvas.width,
        previewSelectionCanvas.height
    );

    previewImage = null;
    previewLayers = [];
    previewSelectedLayerIndex = -1;
    previewSelecting = false;
    previewSelection = null;
    previewSelectionStart = null;
    previewMode = "idle";
    setPreviewActiveButton(null);

    previewSelectionCanvas.style.pointerEvents = "none";
    previewPanel.style.display = "none";

// メッセージキャンバスを初期化
messageCtx.clearRect(
    0,
    0,
    messageCanvas.width,
    messageCanvas.height
);

messageMode = false;
messageDrawing = false;
messageHasContent = false;
messageCanvas.style.pointerEvents = "none";

toggleMessageButton.textContent = "メッセージを書く";

// 現在のカードを解除
currentSnapshot = null;
}

function createPreviewCrop(rect) {
    if (!previewImage) {
        return null;
    }

    var left = Math.max(0, Math.floor(rect.x));
    var top = Math.max(0, Math.floor(rect.y));

    var width = Math.min(
        previewCanvas.width - left,
        Math.ceil(rect.width)
    );

    var height = Math.min(
        previewCanvas.height - top,
        Math.ceil(rect.height)
    );

    if (width <= 0 || height <= 0) {
        return null;
    }

    var cropCanvas = document.createElement("canvas");
    cropCanvas.width = width;
    cropCanvas.height = height;

    var cropCtx = cropCanvas.getContext("2d");

    var sourceImageData = previewCtx.getImageData(
        left,
        top,
        width,
        height
    );

    var pixels = sourceImageData.data;

    for (var index = 0; index < pixels.length; index += 4) {
        var r = pixels[index];
        var g = pixels[index + 1];
        var b = pixels[index + 2];

        if (r > 250 && g > 250 && b > 250) {
            pixels[index + 3] = 0;
        }
    }

    cropCtx.putImageData(sourceImageData, 0, 0);

    return {
        canvas: cropCanvas,
        width: width,
        height: height,
        x: left,
        y: top
    };
}

function cutPreviewSelection() {
    if (
        !previewSelection ||
        previewSelection.width < 2 ||
        previewSelection.height < 2
    ) {
        setStatus("範囲が小さすぎます。もう一度選んでください。");
        return;
    }

    var crop = createPreviewCrop(previewSelection);

    if (!crop) {
        setStatus("選択した範囲から切り出せませんでした。");
        return;
    }

    previewLayers.push(crop);
    previewSelectedLayerIndex = previewLayers.length - 1;

    previewSelecting = false;

    previewSelection = {
        x: previewSelection.x,
        y: previewSelection.y,
        width: previewSelection.width,
        height: previewSelection.height
    };

    previewSelectionStart = null;
    previewMode = "select";

    redrawPreviewOverlay();

    setStatus("範囲を切り出しました。キーボードに登録できます。");
}

function beginPreviewSelection(event) {
    previewSelecting = true;

    previewSelectionCanvas.setPointerCapture(event.pointerId);

    var point = getCanvasPoint(
        event,
        previewSelectionCanvas
    );

    previewSelectionStart = point;

    previewSelection = {
        x: point.x,
        y: point.y,
        width: 0,
        height: 0
    };

    redrawPreviewOverlay();
}

function continuePreviewSelection(event) {
    if (!previewSelecting) {
        return;
    }

    previewSelection = normalizeRect(
        previewSelectionStart,
        getCanvasPoint(event, previewSelectionCanvas)
    );

    redrawPreviewOverlay();
}

function stopPreviewSelection(event) {
    if (!previewSelecting) {
        return;
    }

    previewSelecting = false;

    if (previewSelectionCanvas.hasPointerCapture(event.pointerId)) {
        previewSelectionCanvas.releasePointerCapture(event.pointerId);
    }

    if (
        previewSelection &&
        (
            previewSelection.width < 2 ||
            previewSelection.height < 2
        )
    ) {
        previewSelection = null;
        redrawPreviewOverlay();

        setStatus(
            "範囲が小さすぎます。もう一度、少し広めに選んでください。"
        );

        return;
    }

    if (previewSelection) {
        cutPreviewSelection();
    }
}


// 範囲選択用キャンバスのイベント
previewSelectionCanvas.addEventListener("pointerdown", function (event) {
    if (previewMode !== "select" || messageMode) {
        return;
    }

    beginPreviewSelection(event);
});

previewSelectionCanvas.addEventListener("pointermove", function (event) {
    if (previewSelecting) {
        continuePreviewSelection(event);
    }
});

previewSelectionCanvas.addEventListener("pointerup", function (event) {
    if (previewSelecting) {
        stopPreviewSelection(event);
    }
});

previewSelectionCanvas.addEventListener("pointercancel", function (event) {
    if (previewSelecting) {
        stopPreviewSelection(event);
    }
});

previewSelectionCanvas.addEventListener("pointerleave", function (event) {
    if (previewSelecting) {
        stopPreviewSelection(event);
    }
});


// 範囲選択ボタン
previewSelectButton.addEventListener("click", function () {
    finishMessageMode();
    if (!previewImage) {
        setStatus("先に保存カードを選んでください。");
        return;
    }

    messageMode = false;
    messageCanvas.style.pointerEvents = "none";

    previewMode = "select";
    previewSelectionCanvas.style.pointerEvents = "auto";
    setPreviewActiveButton(previewSelectButton);

    toggleMessageButton.textContent = "メッセージを書く";

    redrawPreviewOverlay();

    setStatus("範囲選択を開始しました。");
});


// プレビューを閉じる
previewClearButton.addEventListener("click", function () {
    finishMessageMode();
    resetPreview();
    setStatus("プレビューを閉じました。");
});


// ------------------------------
// 手書き文字キーボード
// ------------------------------

try {
    registeredGlyphs = JSON.parse(
        localStorage.getItem(GLYPH_STORAGE_KEY) || "{}"
    );
} catch (error) {
    registeredGlyphs = {};
}

kanaKeys.forEach(function (kana) {
    var option = document.createElement("option");

    option.value = kana;
    option.textContent = kana;

    registerKana.appendChild(option);
});

function saveRegisteredGlyphs() {
    try {
        localStorage.setItem(
            GLYPH_STORAGE_KEY,
            JSON.stringify(registeredGlyphs)
        );

        return true;

    } catch (error) {
        setStatus(
            "登録データを保存できませんでした。ストレージ容量を確認してください。"
        );

        return false;
    }
}

function renderHandwritingKeyboard() {
    keyboardGrid.innerHTML = "";

    var keyboardRows = [
        ["っ","ゃ","ぱ","ば","だ","ざ","が","わ","ら","や","ま","は","な","た","さ","か","あ"],
        ["わ","","ぴ","び","ぢ","じ","ぎ","を","り","","み","ひ","に","ち","し","き","い"],
        ["","ゆ","ぷ","ぶ","づ","ず","ぐ","ん","る","ゆ","む","ふ","ぬ","つ","す","く","う"],
        ["","","ぺ","べ","で","ぜ","げ","","れ","","め","へ","ね","て","せ","け","え"],
        ["","よ","ぽ","ぼ","ど","ぞ","ご","","ろ","よ","も","ほ","の","と","そ","こ","お"]
    ];

    keyboardRows.forEach(function (row) {
        row.forEach(function (kana) {
            var key = document.createElement("button");
            key.type = "button";
            key.className = "keyboard-key";

            // 空欄も1マス分の場所を確保する
            if (kana === "") {
                key.style.visibility = "hidden";
                key.disabled = true;
                key.setAttribute("aria-hidden", "true");
                keyboardGrid.appendChild(key);
                return;
            }

            var glyphs = registeredGlyphs[kana];

            if (glyphs && glyphs.length > 0) {
                var glyph = glyphs[glyphs.length - 1];

                key.classList.add("registered");

                var image = document.createElement("img");
                image.src = glyph.dataUrl;
                image.alt = kana + "の手書き文字";

                key.appendChild(image);

                key.addEventListener("click", function () {
                    setStatus(
                        "「" + kana + "」は登録済みです。write.htmlで利用できます。"
                    );
                });

            } else {
                var label = document.createElement("span");
                label.className = "key-label";
                label.textContent = kana;

                key.appendChild(label);
                key.disabled = true;
            }

            keyboardGrid.appendChild(key);
        });
    });
}


// キーボード登録ボタン
registerKeyboardButton.addEventListener("click", function () {
    finishMessageMode();
    if (
        previewSelectedLayerIndex < 0 ||
        !previewLayers[previewSelectedLayerIndex]
    ) {
        setStatus(
            "先に保存カードを選択して、範囲を切り出してください。"
        );

        return;
    }

    registerTargetLayer =
        previewLayers[previewSelectedLayerIndex];

    registerDialog.classList.add("visible");
});

cancelRegisterButton.addEventListener("click", function () {
    registerDialog.classList.remove("visible");
    registerTargetLayer = null;
});

confirmRegisterButton.addEventListener("click", function () {
    if (!registerTargetLayer) {
        return;
    }

    var copyCanvas = document.createElement("canvas");

    copyCanvas.width = registerTargetLayer.canvas.width;
    copyCanvas.height = registerTargetLayer.canvas.height;

    copyCanvas.getContext("2d").drawImage(
        registerTargetLayer.canvas,
        0,
        0
    );

    var kana = registerKana.value;

    if (!registeredGlyphs[kana]) {
        registeredGlyphs[kana] = [];
    }

    registeredGlyphs[kana].push({
        dataUrl: copyCanvas.toDataURL("image/png"),
        savedAt: Date.now()
    });

    if (saveRegisteredGlyphs()) {
        renderHandwritingKeyboard();
        setStatus("「" + kana + "」をキーボードに登録しました。");
    }

    registerDialog.classList.remove("visible");
    registerTargetLayer = null;
});


// キーボード表示切り替え
toggleKeyboardButton.addEventListener("click", function () {
    finishMessageMode();
    var visible = keyboardPanel.classList.toggle("visible");

    toggleKeyboardButton.textContent =
        visible ? "キーボードを隠す" : "キーボードを表示";

    if (visible) {
        renderHandwritingKeyboard();
    }
});

// ------------------------------
// メッセージの保存・復元
// ------------------------------

// 現在のカードにメッセージを保存
function saveCurrentMessage() {
    if (!currentSnapshot) {
        return;
    }

    currentSnapshot.messageDataUrl =
        messageCanvas.toDataURL("image/png");

    try {
        localStorage.setItem(
            SAVED_CARD_STORAGE_KEY,
            JSON.stringify(snapshots)
        );
    } catch (error) {
        setStatus("メッセージを保存できませんでした。");
    }
}


// 選択したカードのメッセージを復元
function restoreMessage(snapshot) {
    messageCtx.clearRect(
        0,
        0,
        messageCanvas.width,
        messageCanvas.height
    );

    messageHasContent = false;

    if (!snapshot.messageDataUrl) {
        return;
    }

    var image = new Image();

    image.onload = function () {
        // 読み込み中に別のカードへ切り替わっていたら描画しない
        if (currentSnapshot !== snapshot) {
            return;
        }

        messageCtx.clearRect(
            0,
            0,
            messageCanvas.width,
            messageCanvas.height
        );

        messageCtx.drawImage(
            image,
            0,
            0,
            messageCanvas.width,
            messageCanvas.height
        );

        messageHasContent = true;
    };

    image.src = snapshot.messageDataUrl;
}


// メッセージ入力を終了して保存
function finishMessageMode() {
    if (messageMode) {
        messageMode = false;
        messageDrawing = false;

        messageCanvas.style.pointerEvents = "none";

        toggleMessageButton.textContent = "メッセージを書く";

        saveCurrentMessage();
    }

    setPreviewActiveButton(null);
}


// ------------------------------
// メッセージ機能
// ------------------------------

// メッセージを書くモードの切り替え
// メッセージを書くモードの切り替え
toggleMessageButton.addEventListener("click", function () {
    if (!previewImage) {
        setStatus("先に保存カードを選んでください。");
        return;
    }

    if (messageMode) {
        // 入力終了・自動保存
        finishMessageMode();

        setStatus("メッセージを保存しました。");
        return;
    }

    // メッセージ入力を開始
    messageMode = true;
    setPreviewActiveButton(toggleMessageButton);

    messageCanvas.style.display =
        messageVisible ? "block" : "none";

    messageCanvas.style.pointerEvents =
        messageVisible ? "auto" : "none";

    // 範囲選択を無効にする
    previewSelectionCanvas.style.pointerEvents = "none";

    toggleMessageButton.textContent =
        "メッセージを書くのを終了";

    setStatus("メッセージを書けます。");
});


// メッセージの表示・非表示
toggleMessageVisibilityButton.addEventListener("click", function () {
    finishMessageMode();
    messageVisible = !messageVisible;

    messageCanvas.style.display =
        messageVisible ? "block" : "none";

    messageCanvas.style.pointerEvents =
        messageMode && messageVisible ? "auto" : "none";

    toggleMessageVisibilityButton.textContent =
        messageVisible
            ? "メッセージを非表示"
            : "メッセージを表示";
});


// メッセージの描画開始
messageCanvas.addEventListener("pointerdown", function (event) {
    if (!messageMode || !messageVisible) {
        return;
    }

    event.preventDefault();

    messageDrawing = true;

    messageCanvas.setPointerCapture(event.pointerId);

    var point = getCanvasPoint(event, messageCanvas);

    messageCtx.beginPath();
    messageCtx.moveTo(point.x, point.y);

    messageCtx.lineWidth = 3;
    messageCtx.lineCap = "round";
    messageCtx.lineJoin = "round";
    messageCtx.strokeStyle = "#222";
});


// メッセージの描画中
messageCanvas.addEventListener("pointermove", function (event) {
    if (!messageDrawing) {
        return;
    }

    event.preventDefault();

    var point = getCanvasPoint(event, messageCanvas);

    messageCtx.lineTo(point.x, point.y);
    messageCtx.stroke();

    messageHasContent = true;
});


// 描画終了
function finishMessageDrawing(event) {
    if (!messageDrawing) {
        return;
    }

    messageDrawing = false;

    if (messageCanvas.hasPointerCapture(event.pointerId)) {
        messageCanvas.releasePointerCapture(event.pointerId);
    }
}

messageCanvas.addEventListener("pointerup", finishMessageDrawing);
messageCanvas.addEventListener("pointercancel", finishMessageDrawing);

// ------------------------------
// すべてのデータをリセット
// ------------------------------

var resetAllButton = document.getElementById("resetAllButton");

resetAllButton.addEventListener("click", function () {

    var confirmed = confirm(
        "保存したカードと登録した手書き文字をすべて削除します。\nこの操作は取り消せません。よろしいですか？"
    );

    if (!confirmed) {
        return;
    }

    // 保存カードを削除
    localStorage.removeItem(SAVED_CARD_STORAGE_KEY);

    // 登録した手書き文字を削除
    localStorage.removeItem(GLYPH_STORAGE_KEY);

    // JavaScript側のデータも初期化
    snapshots = [];
    registeredGlyphs = {};

    // 画面を更新
    resetPreview();
    renderSnapshotList();
    renderHandwritingKeyboard();

    // キーボードを閉じる
    keyboardPanel.classList.remove("visible");
    toggleKeyboardButton.textContent = "キーボードを表示";

    setStatus("保存したカードと登録した手書き文字をすべてリセットしました。");

    alert("すべてのデータをリセットしました！");
});

// ------------------------------
// 初期化
// ------------------------------

loadSnapshotsFromStorage();
renderSnapshotList();
resetPreview();
renderHandwritingKeyboard();

</script>
